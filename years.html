<style>
/* Year by year: the same month (season, year) side by side for every year of the archive, the current one on the right */
:root{
  --paper:#f3f5f7; --paper-2:#e6ebef; --grid:#c9d3dc; --grid-strong:#9fb0bf;
  --ink:#5b3fc4; --ink-soft:rgba(91,63,196,.10); --rain:#2f86b8;
  --fg:#1d2430; --muted:#5f6b7a; --future:rgba(29,36,48,.045); --hot:#c2482a; --cold:#1f74b5; --warn:#8a5a00; --warn-bg:#fff3d6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* type scale: 40 numbers · 16 text · 13 labels · 11 chart */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554; --ink:#a891ff; --ink-soft:rgba(168,145,255,.12); --rain:#5bb3e6;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --hot:#ff8a66; --cold:#6cb8ff; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554; --ink:#a891ff; --ink-soft:rgba(168,145,255,.12); --rain:#5bb3e6;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --hot:#ff8a66; --cold:#6cb8ff; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}
html,body{height:100%}
html{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%} /* iPhone in landscape does not enlarge some of the text on its own */
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.brand{flex:none;margin-top:-6px;text-align:center;font:700 11px/12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--fg)} /* text logo just below the top safe area: real capitals in the bold digits' font and colour (synthesised small caps came out thin and grey) */
header{display:grid;grid-template-rows:22px auto 22px;row-gap:2px}
.rel{text-align:right;font:500 16px/22px var(--f-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{display:flex;align-items:center;gap:2px;min-width:0;margin-left:-6px}
.when span{font:500 16px/22px var(--f-body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.arr{flex:none;width:26px;height:22px;display:grid;place-items:center;border:0;padding:0;background:transparent;color:var(--ink);cursor:pointer;border-radius:6px}
.arr:disabled{visibility:hidden}
.row{display:grid;grid-template-columns:repeat(3,1fr);column-gap:12px;min-width:0}
.part{display:grid;grid-template-rows:18px 44px 18px;min-width:0}
.part>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font:500 13px/18px var(--f-body);color:var(--muted)}
.lbl.sel{color:var(--ink)}.lbl.prev{color:var(--fg)}
.num{font:700 40px/44px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.num.avg{color:var(--muted)}
.dv{font:400 13px/18px var(--f-body);color:var(--muted)}
.dv.warm{color:var(--hot)}.dv.cool{color:var(--cold)}
.chartbox{flex:1;min-height:220px;position:relative;border-top:1px solid var(--grid-strong);border-bottom:1px solid var(--grid-strong);touch-action:pan-y;cursor:grab;user-select:none}
.chartbox:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.ovbox{height:34px;position:relative;touch-action:none;cursor:pointer}

.ibtn:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible,.chartbox:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* the bottom block matches the other pages height for height, so it stays put when switching between them */
.foot{height:32px;display:flex;align-items:center;gap:6px;font:400 13px var(--f-body);color:var(--muted)}

.mode{position:relative;flex:none;margin-left:auto}

.mbtn svg{transition:transform .18s ease}.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.modes{position:absolute;right:0;bottom:calc(100% + 6px);z-index:15;width:min(280px,calc(100vw - 32px));margin:0;padding:4px;list-style:none;
  background:var(--paper);border:1px solid var(--grid);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);transform-origin:100% 100%;animation:pop .16s ease-out}
.modes li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.modes li:hover,.modes li:focus{background:var(--paper-2);outline:none}
.modes li>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.modes b{font:500 16px var(--f-body);color:var(--fg)}.modes li[aria-checked="true"] b{color:var(--ink)}
.modes span{font:400 13px var(--f-body);color:var(--muted)}
.modes i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--grid-strong)}
.modes li[aria-checked="true"] i{background:var(--ink);border-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.modes{animation:none}.mbtn svg{transition:none}}
.note{font:400 13px/1.4 var(--f-body);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

<script>(()=>{const r=document.documentElement, s=screen;
  if(navigator.standalone){r.classList.add("ios-app");
    if(Math.abs(innerHeight-(innerHeight>innerWidth?Math.max(s.width,s.height):Math.min(s.width,s.height)))<8) r.classList.add("ios-full")}
  if(!document.fonts) return; r.classList.add("fl");
  // shown once the fonts are loaded; the charts drew on canvas in the meantime, so they are redrawn with the right font
  const show=()=>{if(r.classList.contains("fl")){r.classList.remove("fl"); dispatchEvent(new Event("resize"))}};
  Promise.all(['500 1em Unbounded','700 1em Unbounded','400 1em "Golos Text"','500 1em "Golos Text"','600 1em "Golos Text"'].map(f=>document.fonts.load(f,"Аa1"))).then(show,show);
  setTimeout(show,3000)})()</script>

<script>
(()=>{
const H=3600e3, DAY=24*H, $=id=>document.getElementById(id);
const MON=['янв','фев','мар','апр','май','июн','июл','авг','сен','окт','ноя','дек'];
const MONF=['Январь','Февраль','Март','Апрель','Май','Июнь','Июль','Август','Сентябрь','Октябрь','Ноябрь','Декабрь'];
const SEAS=['Зима','Весна','Лето','Осень'], SEASL=['зима','весна','лето','осень'];
const FONT='"Golos Text",system-ui,sans-serif';
const FIRST=Date.UTC(1940,0,1);  // the Open-Meteo archive (ERA5) starts here
// the first request reaches back to the 1991–2020 normal; older years load thirty at a time as the view reaches them
const NORM=[1991,2020];          // the climate normal the years are held against, once the archive reaches back that far
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// the moment and the scale on screen, shared by the three pages, so switching between them keeps both:
// t — the moment in view, the city's local time as UTC ms; d — the span in days; now — the view stood on today.
// Kept for seven minutes: the app closed and opened again within them shows what it showed, later it opens on today
const IDLE=7*60e3; // seven minutes away: enough to forget what was on screen, so today and fresh data
const VIEW_IN=(()=>{try{const v=JSON.parse(store.get('view')||'null'); return v&&Date.now()-v.at<IDLE&&isFinite(v.t)&&v.d>0?v:null}catch(e){return null}})();
const nearest=(d,opts)=>opts.reduce((a,b)=>Math.abs(Math.log(b/d))<Math.abs(Math.log(a/d))?b:a);
function keepView(f){const save=()=>{const v=f(); if(v) store.set('view',JSON.stringify({...v,at:Date.now()}))};
  addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') save()});
  document.querySelectorAll('.go a').forEach(a=>a.addEventListener('click',save))}
// back after seven minutes away (screen off, another app): back(), as if the app were opened anew;
// left on screen untouched: idle() every seven minutes, for an hour
// A home-screen app is often frozen in the background without a word, so a pause in the page's own heartbeat counts as time away too
function onWake(back,idle){ let away=0, beat=Date.now(), touched=Date.now(), last=Date.now();
  const check=()=>{const t=Date.now(), gap=t-beat; beat=t;
    if(document.visibilityState==='hidden'){away=away||t; return}
    const gone=(away&&t-away>=IDLE)||gap>=IDLE; away=0; if(gone){touched=last=t; back()}};
  document.addEventListener('visibilitychange',check); addEventListener('pageshow',check); addEventListener('focus',check);
  ['pointerdown','keydown','wheel'].forEach(k=>addEventListener(k,()=>{check(); touched=Date.now()},{capture:true,passive:true}));
  setInterval(()=>{check(); const t=Date.now();
    if(idle&&document.visibilityState==='visible'&&t-touched>=IDLE&&t-touched<3600e3&&t-last>=IDLE){last=t; idle()}},10000)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtT=v=>{if(v==null||isNaN(v))return '—';const r=Math.round(v);return (r>0?'+':r<0?'−':'')+Math.abs(r)+'°'};
const dayOf=ms=>Math.floor(ms/DAY)*DAY;
const plur=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?f[2]:b===1?f[0]:b>=2&&b<=4?f[1]:f[2])};
const NED=['неделю','недели','недель'], MES=['месяц','месяца','месяцев'];
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), ease=k=>1-Math.pow(1-k,3);

let base=0, vals=null, today=0, sample=false, W0=null, ver=0, older=false;
let mode='w', am=new Date().getMonth(), selY=null;  // step: weeks of a month, months of a season, seasons of a year; am — the month in view; selY — the chosen year (null: the newest)
let vis=0, off=0, tVis=0, tOff=0, vel=0;           // columns across the screen and how many of the newest are scrolled past on the right; t* — where they glide to
let disp=null, dispKey='', ys=null, drawQ=0, grow0=0, hdr={}, toSel=false; // toSel: bring the chosen year into view once the columns are there
try{mode=store.get('yrmode')||'w'}catch(e){}

// Open-Meteo directly, or through your own mirror (a Cloudflare Worker) when the direct address does not answer.
// The mirror address goes into MIRROR below, or once through the link: ?mirror=https://name.account.workers.dev
const MIRROR='https://termograf.tasteofthefloor.workers.dev';
const OM_HOSTS={'api.open-meteo.com':'api','archive-api.open-meteo.com':'archive','geocoding-api.open-meteo.com':'geo'};
(()=>{try{const m=new URLSearchParams(location.search).get('mirror'); if(m!=null){m?localStorage.setItem('mirror',m):localStorage.removeItem('mirror')}}catch(e){}})();
// a page served by the worker itself (a preview of a branch) uses that worker as its mirror
const mirrorBase=()=>{let m=/\.workers\.dev$/.test(location.hostname)?location.origin:MIRROR; try{m=localStorage.getItem('mirror')||m}catch(e){} return (m||'').replace(/\/+$/,'')};
function fetchT(u,ms){const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))}
async function omTry(u){
  const m=mirrorBase(), x=new URL(u), via=m?m+'/'+OM_HOSTS[x.host]+x.pathname+x.search:null;
  let skip=false; try{skip=sessionStorage.getItem('omDirect')==='no'}catch(e){}
  if(via&&skip) return fetch(via);
  try{const r=await fetchT(u,via?5000:30000); if(!r.ok&&via) throw 0; return r}
  catch(e){ if(!via) throw e; try{sessionStorage.setItem('omDirect','no')}catch(_){} return fetch(via) }
}
// Open-Meteo lets each address make so many requests a minute, an hour and a day. When neither way gets through,
// all three pages stop asking for a while and say why, instead of passing the empty archive off as its start.

    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length].focus()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault(); li.click()}
    else if(e.key==='Escape'){modesOpen(false); $('modeBtn').focus()}});
  $('modes').append(li)});
$('modeBtn').addEventListener('click',()=>modesOpen($('modes').hidden));
document.addEventListener('pointerdown',e=>{if(!$('modes').hidden&&!e.target.closest('.mode')) modesOpen(false)});
showMetric();
addEventListener('resize',()=>{ovKey='';draw()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ovKey='';draw()});
const zIn=VIEW_IN?{31:'w',92:'m',365:'s'}[nearest(VIEW_IN.d,[31,92,365])]:'';
setMode(zIn||(['w','m','s'].includes(mode)?mode:'w'));
const fromView=applyView();
load().then(()=>{if(!fromView) goToday()});
let loadedAt=Date.now();
onWake(()=>{ goToday(); if(!sample&&Date.now()-loadedAt>=IDLE){loadedAt=Date.now(); load().then(goToday)} }); // back after seven minutes: today and fresh data
keepView(()=>{ if(!vals) return null; const cs=build().cs, last=cs[cs.length-1], c=selY==null?last:cs.find(c=>c.y===selY)||last; if(!c) return null;
  const now=c===last&&today>=c.a&&today<c.b, mm=mode==='m'?3*seasonOf(am):am; // what came from another page stays as it came while it is still in view
  const t=VIEW_IN&&!now&&dayOf(VIEW_IN.t)>=c.a&&dayOf(VIEW_IN.t)<c.b?VIEW_IN.t:Date.UTC(mode!=='w'&&mm===11?c.y-1:c.y,mm,15,12);
  return {t, d:mode===zIn?VIEW_IN.d:{w:31,m:92,s:365}[mode], now};
});
})();
