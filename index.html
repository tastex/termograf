<style>
/* Layout: one screen — readout on top, draggable thermograph ribbon fills the middle, 3‑month overview strip as a scrubber below */
:root{
  --paper:#f3f5f7; --paper-2:#e6ebef; --grid:#c9d3dc; --grid-strong:#9fb0bf;
  --ink:#5b3fc4; --ink-soft:rgba(91,63,196,.13); --rain:#2f86b8; --snow:#7b8fa8;
  --fg:#1d2430; --muted:#5f6b7a; --future:rgba(29,36,48,.045); --night:rgba(44,62,104,.06); --hot:#c2482a; --cold:#1f74b5; --pin:#b07400; --cmp:#0b8670; --warn:#8a5a00; --warn-bg:#fff3d6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* type scale: 64 hero · 22 numbers · 16 text · 13 labels · 11 chart */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554;
  --ink:#a891ff; --ink-soft:rgba(168,145,255,.16); --rain:#5bb3e6; --snow:#c4c0f0;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --night:rgba(0,0,0,.22); --hot:#ff8a66; --cold:#6cb8ff; --pin:#f2b84b; --cmp:#4fd1b0; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554;
  --ink:#a891ff; --ink-soft:rgba(168,145,255,.16); --rain:#5bb3e6; --snow:#c4c0f0;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --night:rgba(0,0,0,.22); --hot:#ff8a66; --cold:#6cb8ff; --pin:#f2b84b; --cmp:#4fd1b0; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}
html,body{height:100%}
html{box-sizing:border-box;-webkit-text-size-adjust:100%;text-size-adjust:100%} /* iPhone in landscape doesn't enlarge some of the text on its own */ /* the safe-area padding on the root stays inside the screen height (home-screen app on iPhone) */
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
.brand{flex:none;margin-top:-6px;text-align:center;font:700 11px/12px var(--f-display);text-transform:uppercase;letter-spacing:.08em;color:var(--fg)} /* text logo just below the top safe area: real capitals in the bold digits' font and colour (synthesised small caps came out thin and grey) */
/* header: one fixed grid shared by the usual reading and the today view, so nothing moves when they swap */
.hgrid{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:22px 42px 22px 20px 26px 20px;row-gap:3px;column-gap:12px;
  grid-template-areas:"temp tag" "temp sub" "date date" "wx wx" "l1 l1" "l2 l2"}
header{position:relative}
.temp{grid-area:temp;align-self:start;height:64px;font:700 64px/64px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.tag,.cond{justify-self:end;text-align:right;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{grid-area:date;font:500 16px/22px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{grid-area:tag;align-self:center;font:500 16px/22px var(--f-body);color:var(--ink)}
.cond{grid-area:sub;align-self:start;font:400 13px/18px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.delta{grid-area:l1;display:flex;align-items:center;gap:8px;font:400 13px/26px var(--f-body);color:var(--muted);white-space:nowrap;min-width:0}
.delta b{font:700 22px/26px var(--f-display);letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.delta button{box-sizing:border-box;flex:none;-webkit-appearance:none;appearance:none;width:24px;height:24px;display:grid;place-items:center;font:500 16px/1 var(--f-body);color:var(--pin);background:transparent;border:1px solid var(--pin);border-radius:50%;padding:0;cursor:pointer}
.verdict{grid-area:l2;font:500 16px/20px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict.warm{color:var(--hot)}.verdict.cool{color:var(--cold)}
.hdr{transition:opacity .18s ease}
header.now .hdr{opacity:0;visibility:hidden}
.trio{position:absolute;inset:0;background:var(--paper);opacity:0;visibility:hidden;transition:opacity .18s ease}
header.now .trio{opacity:1;visibility:visible}
/* today: on the top line what and when, across the whole width; the big number, and today's rain or snow and wind in one line under it;
   on the right the day before and the day after: heading, number, rain and wind, standing on the line of today's icons.
   Their columns have a fixed width, so they never move while the chart is dragged: on a phone at the right edge,
   on a wide screen near the big number, its column as wide as the widest number the mode can show (--nw) */
.trio{display:grid;grid-template-columns:auto minmax(12px,1fr) 86px 86px;grid-template-rows:22px 64px 20px 29px 20px;row-gap:3px;column-gap:20px}
.trio>*{min-width:0}
.trio .tag{grid-row:1;grid-column:1/-1;justify-self:stretch;text-align:left;width:0;min-width:100%} /* takes the room it is given, never widens the columns */
#triN{grid-row:2;grid-column:1}
#triNd{grid-row:3;grid-column:1/3;flex-direction:row;gap:14px;margin-top:-4px}
.tcol{grid-row:1/4;align-self:end;margin-bottom:3.5px;display:flex;flex-direction:column;align-items:flex-end;min-width:0;max-width:100%}
.ty{grid-column:3}.tt{grid-column:4}
.tl{display:flex;align-items:center;gap:6px;max-width:100%;font:500 16px/17px var(--f-body);color:var(--fg);white-space:nowrap}
.tl span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.tl.pin{color:var(--pin)}.tl.cmp{color:var(--cmp)}
.tl .x{box-sizing:border-box;flex:none;-webkit-appearance:none;appearance:none;width:17px;height:17px;display:grid;place-items:center;font:500 14px/1 var(--f-body);color:inherit;background:transparent;border:1px solid currentColor;border-radius:50%;padding:0;cursor:pointer}
.tl .x[hidden]{display:none}
/* the pin or the compared city: one column on the right, as wide as the two */
.trio.one .tt{display:none}.trio.one .ty{grid-column:3/5}
.tn{font:700 28px/32px var(--f-display);letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap;margin-top:-1px}
.wxc{display:flex;flex-direction:column;min-width:0;max-width:100%}
/* yesterday's and tomorrow's rain and wind as a little table: icons under each other, then the word, then the number by its digits, then the unit */
.wxt{align-self:stretch;display:grid;justify-content:end;grid-template-columns:18px auto auto auto auto;column-gap:0;align-items:center;margin-top:-1px;
  font:400 13px/17px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wxt.short{grid-template-columns:18px auto auto auto}
.wxt .r{display:contents}.wxt svg{width:14px;height:14px;display:block}
.wxt .w{padding-right:4px}.wxt .n{text-align:right}.wxt .u{padding-left:4px}.wxt .all{grid-column:2/-1}
.wxt .rain{color:var(--rain)}.wxt .snow{color:var(--snow)}.wxt .strong{color:var(--hot);font-weight:500}
.wx{display:flex;align-items:center;gap:4px;max-width:100%;font:400 13px/19px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.wx svg{flex:none;width:14px;height:14px}
.wx span{min-width:0;overflow:hidden;text-overflow:ellipsis}
.wx.rain{color:var(--rain)}.wx.snow{color:var(--snow)}.wx.strong{color:var(--hot);font-weight:500}
#dayWx{grid-area:wx;flex-direction:row;gap:14px}
@media (min-width:560px){.trio{grid-template-columns:var(--nw,auto) 16px 128px 128px minmax(0,1fr)}}
.tri-say{font:500 16px/20px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#triSay1{grid-row:4;grid-column:1/-1;line-height:26px;align-self:end}#triSay2{grid-row:5;grid-column:1/-1}
@media (prefers-reduced-motion:reduce){.hdr,.trio{transition:none}}
header:not(.ready) .hdr,header:not(.ready) .trio{transition:none} /* the page opens straight on the right header, without a fade */
.chartbox{flex:1;min-height:220px;position:relative;border-top:1px solid var(--grid-strong);border-bottom:1px solid var(--grid-strong);
  touch-action:pan-y;cursor:grab;user-select:none}
.chartbox:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.ovbox{height:54px;position:relative;touch-action:none;cursor:pointer}
/* how much the strip shows: a year, ten years or everything loaded */
.ovz{position:absolute;top:2px;right:2px;height:22px;display:flex;align-items:center;gap:4px;font:500 11px/1 var(--f-body);color:var(--ink);
  background:var(--paper);border:1px solid var(--ink-soft);border-radius:999px;padding:0 9px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ovz::before{content:"";position:absolute;inset:-10px -4px -12px -10px} /* a bigger target for the finger */
.ovz[hidden]{display:none}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.seg{box-sizing:border-box;height:36px;display:inline-flex;align-items:stretch;background:var(--paper-2);border-radius:999px;padding:3px}
.seg button{display:flex;align-items:center;padding-block:0;line-height:1}
.seg button,.btn{font:500 13px var(--f-body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{color:var(--ink);border:1px solid var(--ink)}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.ibtn{box-sizing:border-box;flex:none;-webkit-appearance:none;appearance:none;width:36px;height:36px;min-width:36px;line-height:0;display:grid;place-items:center;border-radius:999px;border:1px solid var(--pin);background:transparent;color:var(--pin);cursor:pointer;padding:0}
.ibtn[aria-pressed="true"]{background:var(--pin);color:var(--paper)}
.ibtn.now{border-color:var(--ink);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font:400 13px/1.4 var(--f-body);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px}
/* the bottom block has fixed heights on both pages, so it stays put when switching between them */
.foot{height:32px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.city{position:relative;display:flex;align-items:center;gap:6px;min-width:0}
.sugg{position:absolute;left:0;bottom:calc(100% + 6px);z-index:15;width:min(320px,calc(100vw - 32px));margin:0;padding:4px;list-style:none;
  background:var(--paper);border:1px solid var(--grid);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.sugg li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--paper-2)}
.sugg b{font:500 16px var(--f-body);color:var(--fg)}
.sugg span{font:400 13px var(--f-body);color:var(--muted)}
.sugg li.wide b{color:var(--ink)}
.sugg li.nothing{cursor:default}.sugg li.nothing:hover{background:none}
.city input{font:500 16px var(--f-body);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--grid-strong);padding:2px 0;width:11ch;flex:0 1 auto;min-width:0;text-overflow:ellipsis}
.city input:focus{outline:none;border-bottom-color:var(--ink)}
.locbtn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:999px;background:var(--paper-2);color:var(--ink);cursor:pointer;padding:0;flex:none}
.locbtn.busy svg{animation:spin 1s linear infinite}
/* the city to compare with: the button is filled while it is on the chart; picking one turns the city field into "compare with" for a moment */
#cmpBtn{color:var(--cmp)}
#cmpBtn[aria-pressed="true"]{background:var(--cmp);color:var(--paper)}
.city.vs #locBtn{display:none}
.city.vs input{border-bottom-color:var(--cmp)}
.city.vs .lbl{color:var(--cmp);white-space:nowrap}
.delta .cmp{color:var(--cmp);min-width:0;overflow:hidden;text-overflow:ellipsis}
.delta button.cmp{color:var(--cmp);border-color:var(--cmp)}
@keyframes spin{to{transform:rotate(360deg)}}
.chartbox canvas,.ovbox canvas{transition:opacity .25s ease}
.chartbox.loading canvas{opacity:.25}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:20;
  max-width:calc(100% - 32px);background:var(--fg);color:var(--paper);font:500 16px/1.3 var(--f-body);padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.chartbox canvas{transition:none}.locbtn.busy svg{animation:none}}
.mode{position:relative;flex:none}
.mbtn{box-sizing:border-box;height:32px;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--ink);background:var(--paper-2);border:0;border-radius:999px;padding:0 12px;cursor:pointer;white-space:nowrap}
.mbtn svg{transition:transform .18s ease}.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sugg.modes{left:auto;right:0;width:min(280px,calc(100vw - 32px));transform-origin:100% 100%;animation:pop .16s ease-out}
.modes li{flex-direction:row;align-items:center;gap:10px}
.modes li>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.modes li[aria-checked="true"] b{color:var(--ink)}
.modes i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--grid-strong)}
.modes li[aria-checked="true"] i{background:var(--ink);border-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.temp small,#triN small{font:500 22px/1 var(--f-body);letter-spacing:0;margin-left:6px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sugg.modes{animation:none}.mbtn svg{transition:none}}
.city .lbl{font:400 13px var(--f-body);color:var(--muted)}
.src{font:400 13px var(--f-body);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.src a{color:inherit}
.links{height:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;font:400 13px/18px var(--f-body);white-space:nowrap}
.x3{font:500 13px var(--f-body);color:var(--muted);text-decoration:none;white-space:nowrap}
.x3 span:nth-child(1){color:var(--rain)}.x3 span:nth-child(2){color:var(--hot)}.x3 span:nth-child(3){color:var(--ink)}
.x3:hover span{text-decoration:underline}
.links .go{display:flex;gap:12px;flex:none}
.yr{font:500 13px var(--f-body);color:var(--ink);text-decoration:none;white-space:nowrap}
.yr:hover{text-decoration:underline}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* iPhone home-screen app: room for the home indicator below; room for the status bar above only when the page runs under it
   (ios-full), even if Safari reports no inset. When iOS itself starts the page below the status bar, no extra room on top */
:root.ios-app{padding-bottom:max(env(safe-area-inset-bottom,0px),20px)}
:root.ios-full{padding-top:max(env(safe-area-inset-top,0px),54px)}
/* hidden until the fonts are in, so the text never jumps from a stand-in font to its own (at most three seconds) */
:root.fl .app{visibility:hidden}</style>
<script>(()=>{const r=document.documentElement, s=screen;
  if(navigator.standalone){r.classList.add("ios-app");
    if(Math.abs(innerHeight-(innerHeight>innerWidth?Math.max(s.width,s.height):Math.min(s.width,s.height)))<8) r.classList.add("ios-full")}
  if(!document.fonts) return; r.classList.add("fl");
  // shown once the fonts are loaded; the charts drew on canvas in the meantime, so they are redrawn with the right font
  const show=()=>{if(r.classList.contains("fl")){r.classList.remove("fl"); dispatchEvent(new Event("resize"))}};
  Promise.all(['500 1em Unbounded','700 1em Unbounded','400 1em "Golos Text"','500 1em "Golos Text"','600 1em "Golos Text"'].map(f=>document.fonts.load(f,"Аa1"))).then(show,show);
  setTimeout(show,3000)})()</script>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app">
  <div class="brand" aria-hidden="true">термограф</div>
  <header class="hgrid">
    <div class="temp hdr" id="temp">—</div>
    <div class="when hdr" id="when">Загружаем погоду…</div>
    <div class="tag hdr" id="tag">&nbsp;</div>
    <div class="cond hdr" id="cond">&nbsp;</div>
    <div class="wxc hdr" id="dayWx"><span class="wx p"></span><span class="wx w"></span></div>
    <div class="delta hdr" id="delta">&nbsp;</div>
    <div class="verdict hdr" id="verdict">&nbsp;</div>
    <div class="trio" id="trio" aria-live="polite">
      <div class="tag" id="triTop">&nbsp;</div>
      <div class="temp" id="triN">—</div>
      <div class="wxc" id="triNd"><span class="wx p"></span><span class="wx w"></span></div>
      <div class="tcol ty" id="triYd"><div class="tl"><span>Вчера</span><button type="button" class="x" hidden>×</button></div><b class="tn" id="triY">—</b><div class="wxt"></div></div>
      <div class="tcol tt" id="triTd"><div class="tl"><span>Завтра</span><button type="button" class="x" hidden>×</button></div><b class="tn" id="triT">—</b><div class="wxt"></div></div>
      <div class="tri-say" id="triSay1">&nbsp;</div>
      <div class="tri-say" id="triSay2">&nbsp;</div>
    </div>
  </header>

<script>

/* ---------- data ---------- */
function sunApprox(day,lat,noonH){
  const doy=(day-Date.UTC(new Date(day).getUTCFullYear(),0,1))/DAY;
  const dec=23.44*Math.PI/180*Math.sin(2*Math.PI*(284+doy)/365), L=lat*Math.PI/180;

// deterministic fake weather for any hour, so the sample can also "load" older periods
function fakeHour(x,lat){

  const doy=(x-Date.UTC(new Date(x).getUTCFullYear(),0,1))/DAY, hr=new Date(x).getUTCHours();

function fakeRange(a,b){

// the chart and the cursor both assume one reading per hour with no gaps: drop repeated hours (clock change),

  li.addEventListener('keydown',e=>{const l=[...$('modes').children], i=l.indexOf(li);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length].focus()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault(); li.click()}
    else if(e.key==='Escape'){modesOpen(false); $('modeBtn').focus()}});
  $('modes').append(li)});
$('modeBtn').addEventListener('click',()=>modesOpen($('modes').hidden));
document.addEventListener('pointerdown',e=>{if(!$('modes').hidden&&!e.target.closest('.mode')) modesOpen(false)});
showMetric();
$('pinBtn').addEventListener('click',()=>{if(!D)return;setPin(pin!=null?null:D.t[idxAt(vc??center)])});
// suggestions while typing: up to six places with region and country
let sugg=[], suggSel=-1, suggT=0, suggQ='';
// none: what the list says when nothing came: 'wide' offers the wider search, 'none' says it found nothing either
function showSugg(list,none){const ul=$('sugg'); sugg=list; suggSel=-1; ul.textContent='';
  list.forEach((w,i)=>{const li=document.createElement('li'); li.setAttribute('role','option'); li.id='sg'+i;
    const b=document.createElement('b'); b.textContent=w.name; li.append(b);
    if(w.region){const sp=document.createElement('span'); sp.textContent=w.region; li.append(sp)}
    li.addEventListener('pointerdown',ev=>{ev.preventDefault(); pickSugg(i)}); ul.append(li)});
  if(!list.length&&none){const li=document.createElement('li'), b=document.createElement('b'), sp=document.createElement('span');
    li.className=none==='wide'?'wide':'nothing'; b.textContent=none==='wide'?'Поискать в OpenStreetMap':'Такого места не нашли'; sp.textContent=none==='wide'?'В списке сервиса погоды такого места нет':'Проверьте название';
    li.append(b,sp); if(none==='wide') li.addEventListener('pointerdown',ev=>{ev.preventDefault(); searchWide($('city').value.trim())}); ul.append(li)}
  const open=!!ul.children.length; ul.hidden=!open; $('city').setAttribute('aria-expanded',String(open));}
async function searchWide(q){if(q.length<2) return; suggQ=q; let r=[]; try{r=await geocodeWide(q)}catch(e){}
  if(suggQ===q&&document.activeElement===$('city')) showSugg(r,'none'); return r}
function hideSugg(){showSugg([])}
function markSugg(){[...$('sugg').children].forEach((li,i)=>li.setAttribute('aria-selected',String(i===suggSel)));
  $('city').setAttribute('aria-activedescendant',suggSel>=0?'sg'+suggSel:'')}
function pickSugg(i){const w=sugg[i]; if(!w) return; hideSugg(); const p={name:w.name,lat:+w.lat.toFixed(3),lon:+w.lon.toFixed(3)};
  if(vs){vsMode(false); $('city').blur(); setCmp(p); return}
  $('city').value=w.name; $('city').blur(); setPin(null); load(p,true)}
// the button by the city field: the field asks for a city to compare with (the same suggestions), and pressed again stops comparing
let vs=false;
function vsMode(on){vs=on; $('cityForm').classList.toggle('vs',on); $('cityLbl').textContent=on?'Сравнить с':'Город';
  $('city').placeholder=on?'городом':'Город'; $('city').setAttribute('aria-label',on?'С каким городом сравнить':'Город');
  if(on){$('city').value=''; $('city').focus()} else if(D&&D.where) $('city').value=D.where.name}
$('cmpBtn').addEventListener('pointerdown',e=>{if(vs) e.preventDefault()}); // a second tap while choosing does not blur the field first
$('cmpBtn').addEventListener('click',()=>{if(vs){hideSugg(); vsMode(false); $('city').blur(); return} if(cmpWant) setCmp(null); else vsMode(true)});
showCmp();
$('city').addEventListener('input',()=>{const q=$('city').value.trim(); clearTimeout(suggT);
  if(q.length<2){hideSugg();return}
  suggT=setTimeout(async()=>{suggQ=q; let r=[], ok=true; try{r=await geocodeAll(q,6)}catch(e){ok=false} if(suggQ===q&&document.activeElement===$('city')) showSugg(r,ok&&q.length>=3?'wide':null)},250)});
$('city').addEventListener('keydown',e=>{if($('sugg').hidden) return;
  if(e.key==='Enter'&&!sugg.length&&$('sugg').querySelector('.wide')&&suggQ===$('city').value.trim()){e.preventDefault(); searchWide(suggQ); return} // nothing in the list: Enter asks wider
  if(!sugg.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); suggSel=(suggSel+(e.key==='ArrowDown'?1:-1)+sugg.length)%sugg.length; markSugg()}
  else if(e.key==='Enter'&&suggSel>=0){e.preventDefault(); pickSugg(suggSel)}
  else if(e.key==='Escape'){hideSugg()}});
$('city').addEventListener('keydown',e=>{if(e.key==='Escape'&&vs&&$('sugg').hidden) $('city').blur()});
$('city').addEventListener('blur',()=>setTimeout(()=>{hideSugg(); if(vs&&document.activeElement!==$('city')) vsMode(false)},150));
$('cityForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('city').value.trim();
  if(sugg[0]&&suggQ===q){pickSugg(0);return} // Enter takes the first suggestion
  const v=vs; $('city').blur();hideSugg();if(v) vsMode(false);if(!q)return;
  const find=async()=>{let w=null; try{w=await geocode(q)}catch(err){} if(!w){try{const r=await geocodeWide(q); if(r[0]) w={name:r[0].name,lat:+r[0].lat.toFixed(3),lon:+r[0].lon.toFixed(3)}}catch(err){}} return w};
  if(v){const w=await find(); if(w) setCmp(w); else toast(D&&D.sample?'Внутри Claude поиск городов не работает. Откройте tastex.github.io/termograf':'Город «'+q+'» не найден. Проверьте название'); return}
  $('chartbox').classList.add('loading');
  const w=await find();
  if(!w){$('chartbox').classList.remove('loading');toast(D&&D.sample?'Внутри Claude поиск городов не работает. Откройте tastex.github.io/termograf':'Город «'+q+'» не найден. Проверьте название');return}
  setPin(null); load(w,true)});
$('city').addEventListener('blur',()=>{setTimeout(()=>window.scrollTo(0,0),50)});
$('locBtn').addEventListener('click',async()=>{const b=$('locBtn');b.classList.add('busy');
  try{const w=await hereByGps();setPin(null);await load(w,true)}
  catch(err){
    // GPS refused or failed: fall back to the city by network and say why
    const framed=window.top!==window, ios=/iP(hone|ad|od)/.test(navigator.userAgent);
    const why=framed?'Внутри Claude геопозиция не работает. Откройте tastex.github.io/termograf'
      :err&&err.code===1?(ios?'Геопозиция выключена для сайтов: Настройки → Конфиденциальность → Службы геолокации → Сайты Safari':'Браузер не разрешил определить место. Разрешите доступ к геопозиции в настройках сайта')
      :err&&err.code===3?'Не получилось определить место за 10 секунд':'Не получилось определить точное место';
    let w=null; try{w=await hereByIp()}catch(e){}
    if(w){setPin(null);await load(w,why+'. Пока показываем '+w.name+': город определили по интернет‑подключению')} else toast(why+(framed?'':'. Попробуйте ещё раз или введите город'));
  }
  b.classList.remove('busy')});
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

const zIn=VIEW_IN?nearest(VIEW_IN.d,[3,7,30,365])*24:0;
setZoom(zIn||Math.min(SPAN_MAX,Math.max(SPAN_MIN,+store.get('span')||72)));
keepView(()=>{ if(!D) return null; // the scale and the day stay as they came while untouched here, so 3 days survive a trip through a page without them
  const t=vc??center, now=viewWant==null&&Math.abs(t-(snapNow?snapNow(D.now):D.now))<H, same=VIEW_IN&&!now&&dayOf(t)===dayOf(VIEW_IN.t);
  return {t:viewWant??(same?VIEW_IN.t:t), d:spanH===zIn?VIEW_IN.d:spanH/24, now};
});
// keep "now" current while the page is open; back after seven minutes away: today and fresh data,
// left untouched on screen: fresh data where the view stands (unless it is deep in the archive, which a reload would drop)
setInterval(()=>{if(D){D.now=Date.now()+D.off;draw()}},60000);
const refresh=()=>{if(D&&!D.sample&&D.where&&Date.now()-D.at>=IDLE) load(D.where,false)};
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&D){D.now=Date.now()+D.off;draw()}});
onWake(()=>{ if(!D) return; viewWant=null; vc=null; yMin=null; goToday(); refresh() },
  ()=>{ if(D&&(vc??center)>=D.now-80*DAY) refresh() });

/* ---------- link with the city, home-screen app ---------- */
function setUrl(w){ // keep the place in the address so a bookmark or home-screen icon opens this city
  try{const u=new URL(location.href); u.search=''; u.searchParams.set('city',w.name); u.searchParams.set('lat',w.lat); u.searchParams.set('lon',w.lon);
    history.replaceState(null,'',u); updateManifest(w); $('x3').href='three.html'+u.search; $('yr').href='years.html'+u.search}catch(e){}
}
function updateManifest(w){
  const link=document.querySelector('link[rel="manifest"]'); if(!link) return;
  const base=new URL('./',location.href).href, abs=f=>new URL(f,base).href;
  const m={id:location.href,name:'Термограф — '+w.name,short_name:w.name.length<=12?w.name:'Термограф',lang:'ru',
    start_url:location.href,scope:base,display:'standalone',background_color:'#f3f5f7',theme_color:'#5b3fc4',
    icons:[{src:abs('icon-192.png'),sizes:'192x192',type:'image/png'},{src:abs('icon-512.png'),sizes:'512x512',type:'image/png'},
      {src:abs('icon-maskable-512.png'),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
  const t=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(t) t.content=m.short_name;
}
async function placeFromUrl(){
  const q=new URLSearchParams(location.search), lat=parseFloat(q.get('lat')), lon=parseFloat(q.get('lon')), c=q.get('city');
  if(isFinite(lat)&&isFinite(lon)) return {name:c||'Место',lat,lon};
  if(c){try{return await geocode(c)}catch(e){}}
  return null;
}
if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{ // start: place in the link → saved place → silent GPS if already allowed → city by network → Moscow
  const MSK={name:'Москва',lat:55.756,lon:37.617};
  let w=await placeFromUrl();
  if(!w){try{w=JSON.parse(store.get('place')||'null')}catch(e){}}
  if(!w){try{const st=await navigator.permissions?.query({name:'geolocation'}); if(st&&st.state==='granted') w=await hereByGps()}catch(e){}}
  if(!w){try{w=await hereByIp()}catch(e){}}
  load(w||MSK,false);
})();
})();
</script>
