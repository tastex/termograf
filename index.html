<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-visual">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Термограф">

<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#12161d">
<title>Термограф</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one screen — readout on top, draggable thermograph ribbon fills the middle, 3‑month overview strip as a scrubber below */
:root{
  --paper:#f3f5f7; --paper-2:#e6ebef; --grid:#c9d3dc; --grid-strong:#9fb0bf;
  --ink:#5b3fc4; --ink-soft:rgba(91,63,196,.13); --rain:#2f86b8;
  --fg:#1d2430; --muted:#5f6b7a; --future:rgba(29,36,48,.045); --night:rgba(44,62,104,.06); --hot:#c2482a; --cold:#1f74b5; --pin:#b07400; --warn:#8a5a00; --warn-bg:#fff3d6;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* type scale: 64 hero · 22 numbers · 16 text · 13 labels · 11 chart */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554;
  --ink:#a891ff; --ink-soft:rgba(168,145,255,.16); --rain:#5bb3e6;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --night:rgba(0,0,0,.22); --hot:#ff8a66; --cold:#6cb8ff; --pin:#f2b84b; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554;
  --ink:#a891ff; --ink-soft:rgba(168,145,255,.16); --rain:#5bb3e6;
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --night:rgba(0,0,0,.22); --hot:#ff8a66; --cold:#6cb8ff; --pin:#f2b84b; --warn:#f2c46b; --warn-bg:#2d2412; color-scheme:dark}
html,body{height:100%}
html{box-sizing:border-box} /* the safe-area padding on the root stays inside the screen height (home-screen app on iPhone) */
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
/* header: one fixed grid shared by the usual reading and the today view, so nothing moves when they swap */
.hgrid{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-rows:22px 42px 22px 26px 20px;row-gap:3px;column-gap:12px;
  grid-template-areas:"temp tag" "temp sub" "date date" "l1 l1" "l2 l2"}
header{position:relative}
.temp{grid-area:temp;align-self:start;height:64px;font:700 64px/64px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums;color:var(--fg);white-space:nowrap}
.tag,.cond,.tri-pair{justify-self:end;text-align:right;max-width:100%;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{grid-area:date;font:500 16px/22px var(--f-body);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{grid-area:tag;align-self:center;font:500 16px/22px var(--f-body);color:var(--ink)}
.cond{grid-area:sub;align-self:start;font:400 13px/18px var(--f-body);color:var(--muted);font-variant-numeric:tabular-nums}
.delta{grid-area:l1;display:flex;align-items:center;gap:8px;font:400 13px/26px var(--f-body);color:var(--muted);white-space:nowrap;min-width:0}
.delta b{font:700 22px/26px var(--f-display);letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.delta button{box-sizing:border-box;flex:none;-webkit-appearance:none;appearance:none;width:24px;height:24px;display:grid;place-items:center;font:500 16px/1 var(--f-body);color:var(--pin);background:transparent;border:1px solid var(--pin);border-radius:50%;padding:0;cursor:pointer}
.verdict{grid-area:l2;font:500 16px/20px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.verdict.warm{color:var(--hot)}.verdict.cool{color:var(--cold)}
.hdr{transition:opacity .18s ease}
header.now .hdr{opacity:0;visibility:hidden}
.trio{position:absolute;inset:0;background:var(--paper);opacity:0;visibility:hidden;transition:opacity .18s ease}
header.now .trio{opacity:1;visibility:visible}
.tri-pair{grid-area:sub;align-self:start;display:flex;gap:18px}
.tri-pair>div{display:flex;flex-direction:column;align-items:flex-end}
.tri-pair small{font:400 13px/16px var(--f-body);color:var(--muted)}
.tri-pair b{font:700 22px/26px var(--f-display);letter-spacing:-.02em;color:var(--fg);font-variant-numeric:tabular-nums}
.tri-say{font:500 16px/20px var(--f-body);color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#triSay1{grid-area:l1;line-height:26px}#triSay2{grid-area:l2}
@media (prefers-reduced-motion:reduce){.hdr,.trio{transition:none}}
.chartbox{flex:1;min-height:220px;position:relative;border-top:1px solid var(--grid-strong);border-bottom:1px solid var(--grid-strong);
  touch-action:pan-y;cursor:grab;user-select:none}
.chartbox:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.ovbox{height:54px;position:relative;touch-action:none;cursor:pointer}
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px}
.seg{box-sizing:border-box;height:36px;display:inline-flex;align-items:stretch;background:var(--paper-2);border-radius:999px;padding:3px}
.seg button{display:flex;align-items:center;padding-block:0;line-height:1}
.seg button,.btn{font:500 13px var(--f-body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:7px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.btn{color:var(--ink);border:1px solid var(--ink)}
.acts{display:flex;gap:8px;align-items:center;flex:none}
.ibtn{box-sizing:border-box;flex:none;-webkit-appearance:none;appearance:none;width:36px;height:36px;min-width:36px;line-height:0;display:grid;place-items:center;border-radius:999px;border:1px solid var(--pin);background:transparent;color:var(--pin);cursor:pointer;padding:0}
.ibtn[aria-pressed="true"]{background:var(--pin);color:var(--paper)}
.ibtn.now{border-color:var(--ink);color:var(--ink)}
.ibtn:disabled{opacity:.35;cursor:default}
.btn:disabled{opacity:.35;cursor:default}
button:focus-visible,input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.note{font:400 13px/1.4 var(--f-body);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px}
/* the bottom block has fixed heights on both pages, so it stays put when switching between them */
.foot{height:32px;display:flex;align-items:center;justify-content:space-between;gap:14px}
.city{position:relative;display:flex;align-items:center;gap:6px;min-width:0}
.sugg{position:absolute;left:0;bottom:calc(100% + 6px);z-index:15;width:min(320px,calc(100vw - 32px));margin:0;padding:4px;list-style:none;
  background:var(--paper);border:1px solid var(--grid);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16)}
.sugg li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;gap:1px}
.sugg li[aria-selected="true"],.sugg li:hover{background:var(--paper-2)}
.sugg b{font:500 16px var(--f-body);color:var(--fg)}
.sugg span{font:400 13px var(--f-body);color:var(--muted)}
.city input{font:500 16px var(--f-body);color:var(--fg);background:transparent;border:0;border-bottom:1px dashed var(--grid-strong);padding:2px 0;width:14ch;min-width:0}
.city input:focus{outline:none;border-bottom-color:var(--ink)}
.locbtn{width:32px;height:32px;display:grid;place-items:center;border:0;border-radius:999px;background:var(--paper-2);color:var(--ink);cursor:pointer;padding:0;flex:none}
.locbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.chartbox canvas,.ovbox canvas{transition:opacity .25s ease}
.chartbox.loading canvas{opacity:.25}
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 72px);transform:translate(-50%,12px);opacity:0;pointer-events:none;z-index:20;
  max-width:calc(100% - 32px);background:var(--fg);color:var(--paper);font:500 16px/1.3 var(--f-body);padding:10px 16px;border-radius:12px;box-shadow:0 6px 24px rgba(0,0,0,.18);transition:opacity .25s ease,transform .25s ease}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.toast,.chartbox canvas{transition:none}.locbtn.busy svg{animation:none}}
.mode{position:relative;flex:none}
.mbtn{box-sizing:border-box;height:32px;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--ink);background:var(--paper-2);border:0;border-radius:999px;padding:0 12px;cursor:pointer;white-space:nowrap}
.mbtn svg{transition:transform .18s ease}.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.sugg.modes{left:auto;right:0;width:min(280px,calc(100vw - 32px));transform-origin:100% 100%;animation:pop .16s ease-out}
.modes li{flex-direction:row;align-items:center;gap:10px}
.modes li>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.modes li[aria-checked="true"] b{color:var(--ink)}
.modes i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--grid-strong)}
.modes li[aria-checked="true"] i{background:var(--ink);border-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
.temp small,#triN small{font:500 22px/1 var(--f-body);letter-spacing:0;margin-left:6px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.sugg.modes{animation:none}.mbtn svg{transition:none}}
.city .lbl{font:400 13px var(--f-body);color:var(--muted)}
.src{font:400 13px var(--f-body);color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis}
.src a{color:inherit}
.links{height:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;font:400 13px/18px var(--f-body);white-space:nowrap}
.x3{font:500 13px var(--f-body);color:var(--muted);text-decoration:none;white-space:nowrap}
.x3 span:nth-child(1){color:var(--rain)}.x3 span:nth-child(2){color:var(--hot)}.x3 span:nth-child(3){color:var(--ink)}
.x3:hover span{text-decoration:underline}
.links .go{display:flex;gap:12px;flex:none}
.yr{font:500 13px var(--f-body);color:var(--ink);text-decoration:none;white-space:nowrap}
.yr:hover{text-decoration:underline}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* iPhone home-screen app: never less than the status bar, even if Safari reports no inset */
:root.ios-app{padding-top:max(env(safe-area-inset-top,0px),54px);padding-bottom:max(env(safe-area-inset-bottom,0px),20px)}</style>
<script>if(navigator.standalone)document.documentElement.classList.add("ios-app")</script>
</head>
<body>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="app">
  <header class="hgrid">
    <div class="temp hdr" id="temp">—</div>
    <div class="when hdr" id="when">Загрузка…</div>
    <div class="tag hdr" id="tag">&nbsp;</div>
    <div class="cond hdr" id="cond">&nbsp;</div>
    <div class="delta hdr" id="delta">&nbsp;</div>
    <div class="verdict hdr" id="verdict">&nbsp;</div>
    <div class="trio hgrid" id="trio" aria-live="polite">
      <div class="temp" id="triN">—</div>
      <div class="when" id="triWhen">&nbsp;</div>
      <div class="tag" id="triTop">&nbsp;</div>
      <div class="tri-pair"><div><small>Вчера</small><b id="triY">—</b></div><div><small>Завтра</small><b id="triT">—</b></div></div>
      <div class="tri-say" id="triSay1">&nbsp;</div>
      <div class="tri-say" id="triSay2">&nbsp;</div>
    </div>
  </header>
  <div class="note" id="note" hidden>Это пример, а не настоящая погода: внутри Claude страница не может её загрузить. Настоящая — на tastex.github.io/termograf</div>
  <div class="chartbox loading" id="chartbox"><canvas id="chart" aria-label="График температуры по часам; тяните влево и вправо"></canvas></div>
  <div class="ovbox" id="ovbox"><canvas id="ov" aria-label="Обзор всего загруженного периода"></canvas></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Масштаб">
      <button id="z3" data-h="72">3 дня</button>
      <button id="z7" data-h="168">Неделя</button>
      <button id="z30" data-h="720">Месяц</button>
      <button id="z365" data-h="8760">Год</button>
    </div>
    <div class="acts">
      <button class="ibtn" id="pinBtn" type="button" aria-pressed="false" aria-label="Поставить метку на точку под курсором"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 17v5"/><path d="M9 3h6l-1 6 3 4H7l3-4z"/></svg></button>
      <button class="ibtn now" id="today" type="button" aria-label="К сегодня" title="К сегодня"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg></button>
    </div>
  </div>
  <div class="foot">
    <form class="city" id="cityForm">
      <span class="lbl">Город</span>
      <input id="city" value="" placeholder="Город" autocomplete="off" enterkeyhint="search" aria-label="Город" role="combobox" aria-autocomplete="list" aria-controls="sugg" aria-expanded="false">
      <ul class="sugg" id="sugg" role="listbox" hidden></ul>
      <button class="locbtn" id="locBtn" type="button" aria-label="Показать погоду там, где я сейчас"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
    </form>
    <div class="mode">
      <button class="mbtn" id="modeBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="modes"><span id="modeName">Температура</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <ul class="sugg modes" id="modes" role="listbox" aria-label="Что показывать" hidden></ul>
    </div>
  </div>
  <div class="links">
    <div class="src"><span id="tz"></span>Данные <a href="https://open-meteo.com" target="_blank" rel="noopener">Open‑Meteo</a></div>
    <div class="go"><a class="x3" id="x3" href="three.html"><span>Утро</span>, <span>день</span>, <span>вечер</span></a><a class="yr" id="yr" href="years.html">По годам</a></div>
  </div>
</div>

<script>
(()=>{
const H=3600e3, DAY=24*H;
const $=id=>document.getElementById(id);
const chart=$('chart'), ov=$('ov'), box=$('chartbox'), ovbox=$('ovbox');
const WD=['вс','пн','вт','ср','чт','пт','сб'], MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const REL={'-2':'позавчера','-1':'вчера','0':'сегодня','1':'завтра','2':'послезавтра'};
const WC={0:'ясно',1:'почти ясно',2:'облачно',3:'пасмурно',45:'туман',48:'изморозь',51:'морось',53:'морось',55:'сильная морось',56:'ледяная морось',57:'ледяная морось',61:'небольшой дождь',63:'дождь',65:'сильный дождь',66:'ледяной дождь',67:'ледяной дождь',71:'небольшой снег',73:'снег',75:'сильный снег',77:'снежная крупа',80:'ливень',81:'ливень',82:'сильный ливень',85:'снегопад',86:'сильный снегопад',95:'гроза',96:'гроза с градом',99:'гроза с градом'};
const MONO='"Golos Text",system-ui,sans-serif'; // chart labels use the text face

let D=null;   // {t:[ms local-as-UTC], temp, rain, code, sun:{dayMs:[rise,set]}, now}
const Q=H/4; // quarter hour
let spanV=72, fz=0, fzOn=false, slowMs=0, lastFrame=0; // spanV: hours actually on screen; fz: slow-drag zoom progress 0..1
let warp=null, pull=0, center=0, spanH=72, yMin=0, yMax=20, yRaf=0, vel=0, raf=0, pin=null, geom=null;

const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{v==null?localStorage.removeItem(k):localStorage.setItem(k,v)}catch(e){}}};
function css(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function fmtT(v){const r=Math.round(v);return (r>0?'+':r<0?'−':'')+Math.abs(r)+'°'}
function fmtD(v){const r=Math.round(v);return (r>0?'+':r<0?'−':'±')+Math.abs(r)+'°'}
// what the chart can show: an Open-Meteo variable each, with its units, scale and the words for "more" and "less".
// D.temp is always the series on screen; the others wait in D.s
const NUM=u=>({num:v=>String(Math.round(v)),unit:u,short:v=>Math.round(v)+(u==='%'?u:''),dif:v=>{const r=Math.round(v);return (r>0?'+':r<0?'−':'±')+Math.abs(r)+u.trim()}});
const TEMP={num:fmtT,short:fmtT,unit:'',dif:fmtD,more:'теплее',less:'холоднее',th:[1,3,6,10,15],
  lim:(lo,hi)=>{let mn=Math.floor((lo-3)/5)*5, mx=Math.ceil((hi+2.5)/5)*5; if(mx-mn<15) mx=mn+15; return [mn,mx]}, step:r=>r>40?10:5};
const METRICS={
  temp:{...TEMP,name:'Температура',hint:'°C'},
  feel:{...TEMP,name:'Ощущается',hint:'с учётом ветра и влажности'},
  wind:{...NUM('\u202fм/с'),num:v=>v<9.95?(Math.round(v*10)/10).toFixed(1).replace('.',','):String(Math.round(v)),dif:v=>(v>=.05?'+':v<=-.05?'−':'±')+(Math.abs(v)<9.95?Math.abs(v).toFixed(1).replace('.',','):Math.round(Math.abs(v)))+'\u202fм/с',
    name:'Ветер',cur:'текущему',hint:'м/с, порывы и направление',more:'сильнее',less:'слабее',th:[.5,1.5,3,5,8],
    lim:(lo,hi)=>[0,Math.max(10,Math.ceil((hi+1)/5)*5)], step:r=>r>25?10:r>12?5:2},
  pres:{...NUM('\u202fмм'),name:'Давление',cur:'текущему',hint:'мм рт. ст.',more:'выше',less:'ниже',th:[1,3,6,10,15],
    lim:(lo,hi)=>{let mn=Math.floor((lo-2)/5)*5, mx=Math.ceil((hi+2)/5)*5; if(mx-mn<15){mn-=5;mx=mn+20} return [mn,mx]}, step:r=>r>40?10:5},
  hum:{...NUM('%'),name:'Влажность',hint:'относительная, %',more:'влажнее',less:'суше',th:[3,8,15,25,40],lim:()=>[0,100],step:()=>25},
  cloud:{...NUM('%'),name:'Облачность',hint:'доля неба в облаках, %',more:'облачнее',less:'яснее',th:[5,15,30,50,70],lim:()=>[0,100],step:()=>25},
};
// series kept for every hour: the chartable ones plus gusts and direction for the wind readout
const SER={temp:'temperature_2m',feel:'apparent_temperature',wind:'wind_speed_10m',gust:'wind_gusts_10m',dir:'wind_direction_10m',pres:'pressure_msl',hum:'relative_humidity_2m',cloud:'cloud_cover'};
const SK=Object.keys(SER), hPa=0.750062; // pressure arrives in hPa and is shown in mm of mercury
const series=(h,k,n)=>{const a=h[SER[k]]||new Array(n).fill(null); return k==='pres'?a.map(v=>v==null?v:v*hPa):a.slice()};
const fmtV=v=>M().num(v)+M().unit, fmtS=v=>M().short(v), fmtDV=v=>M().dif(v); // fmtS: chart labels, the units are in the big number
const RUMB=['С','СВ','В','ЮВ','Ю','ЮЗ','З','СЗ'], rumb=d=>RUMB[Math.round(((d%360)+360)%360/45)%8];

  // difference with the pin, or with the current hour (the current day's mean in the year view)
  const ref=pin!=null?idxAt(pin):idxAt(D.now), el=$('delta'); el.textContent='';
  const rr=dayRec(D.t[ref]), refVal=yr?rr.sum/rr.n:(tq!=null&&pin==null&&inQ(D.now))?D.q.temp[qIdx(D.now)]:D.temp[ref];
  const dv=val-refVal, b=document.createElement('b'); b.textContent='Δ '+fmtDV(dv); el.append(b);
  const vd=$('verdict'); vd.textContent=verdictOf(dv); vd.className='verdict'+(Math.abs(dv)<M().th[0]?'':dv>0?' warm':' cool');
  if(pin!=null){
    const rt=D.t[ref], pd=REL[relDay(rt)], dt=new Date(rt);
    const lab=(pd||dt.getUTCDate()+' '+MON[dt.getUTCMonth()]+withYear(rt))+(yr?'':', '+hh(rt));
    el.append((yr?' к средней за ':' к ')+lab+' ');
    const x=document.createElement('button');x.type='button';x.textContent='×';x.setAttribute('aria-label','Снять метку');x.onclick=()=>setPin(null);el.append(x);
  } else el.append(yr?' к средней за сегодня':' к '+(M().cur||'текущей'));
  const pb=$('pinBtn'); pb.setAttribute('aria-pressed',String(pin!=null)); pb.setAttribute('aria-label',pin!=null?'Снять метку':'Поставить метку на точку под курсором');
}
function setPin(ms){pin=ms;pinWant=null;store.set('pin',ms==null?null:String(ms));draw()}

let ovKey='', ovBg=null;
function drawOv(C){
  const [g,W,Ht]=fit(ov), a=D.t[0], b=D.fut, X=ms=>(ms-a)/(b-a)*W, dpr=devicePixelRatio||1;
  const key=[a,b,W,Ht,dpr,C.ink,busy].join('|');
  if(key!==ovKey){ // the static part (seasons, bars, months) is drawn once and reused while scrolling
    ovKey=key; ovBg=ovBg||document.createElement('canvas'); ovBg.width=Math.round(W*dpr); ovBg.height=Math.round(Ht*dpr);
    const o=ovBg.getContext('2d'); o.setTransform(dpr,0,0,dpr,0,0); o.clearRect(0,0,W,Ht);
    const Y=v=>4+(D.gh-v)/(D.gh-D.gl||1)*(Ht-16), long=(b-a)>700*DAY;
    // seasons: winter cool, summer warm, as faint bands
    for(let y=new Date(a).getUTCFullYear()-1;y<=new Date(b).getUTCFullYear();y++){
      const w0=X(Date.UTC(y,11,1)),w1=X(Date.UTC(y+1,2,1)),s0=X(Date.UTC(y,5,1)),s1=X(Date.UTC(y,8,1));
      o.globalAlpha=.10;o.fillStyle=C.cold;o.fillRect(w0,0,w1-w0,Ht-10);o.fillStyle=C.hot;o.fillRect(s0,0,s1-s0,Ht-10);o.globalAlpha=1}
    o.fillStyle=C.ink;o.globalAlpha=.6;
    for(const d of D.days){if(!d||d.k>=b)continue;const x=X(d.k),w=Math.max(.6,X(d.k+DAY)-x-(long?0:1));o.fillRect(x,Y(d.hi),w,Math.max(1,Y(d.lo)-Y(d.hi)))}
    o.globalAlpha=1;o.font='500 11px '+MONO;o.textBaseline='alphabetic'; let lastEnd=-1;
    for(let d=new Date(Date.UTC(new Date(a).getUTCFullYear(),new Date(a).getUTCMonth(),1));d.getTime()<=b;d=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth()+1,1))){
      const m=d.getTime(); if(m<a) continue; const x=X(m), jan=d.getUTCMonth()===0;
      o.fillStyle=C.muted;
      if(jan||!long){o.fillRect(x,0,1,Ht);const tx=jan?String(d.getUTCFullYear()):MON[d.getUTCMonth()];if(x+3>=lastEnd){o.fillText(tx,x+3,Ht-1);lastEnd=x+3+o.measureText(tx).width+3}}
      else o.fillRect(x,Ht-12,1,3); // small month ticks when years are shown
    }
    if(busy){o.fillStyle=C.ink;o.fillText('загрузка…',3,10)}
  }
  g.clearRect(0,0,W,Ht); g.drawImage(ovBg,0,0,W,Ht);
  const x0=Math.max(0,X(center-spanV*H/2)),x1=Math.min(W,X(center+spanV*H/2));
  g.fillStyle=C.fg;g.globalAlpha=.08;g.fillRect(x0,0,x1-x0,Ht);g.globalAlpha=1;
  g.strokeStyle=C.fg;g.lineWidth=1.5;g.strokeRect(x0+.75,.75,Math.max(2,x1-x0-1.5),Ht-1.5);
  g.fillStyle=C.fg;g.fillRect(X(D.now)-.5,0,1,Ht);
  if(pin!=null){g.fillStyle=C.pin;g.fillRect(X(pin)-1,0,2,Ht)}
}

/* ---------- interaction ---------- */
let drag=null;
box.addEventListener('pointerdown',e=>{if(!D)return;cancelAnimationFrame(raf);drag={x:e.clientX,y:e.clientY,last:e.clientX,t:performance.now(),lock:null,v:center+pull/(box.clientWidth/spanV)*H};vel=0});
window.addEventListener('pointermove',e=>{if(!drag)return;
  if(drag.lock===null){const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);if(dx<6&&dy<6)return;drag.lock=dx>dy?'x':'y';if(drag.lock==='x')box.setPointerCapture?.(e.pointerId)}
  if(drag.lock!=='x')return;
  const dx=e.clientX-drag.last, now=performance.now();
  const W=box.clientWidth, pph=W/spanV;
  drag.v-=dx/pph*H; center=drag.v; clamp();
  const rr=Math.max(0,(drag.v-maxC())/H*pph), rl=Math.max(0,(minC()-drag.v)/H*pph), rub=r=>W*0.3*(1-Math.exp(-r/(W*0.6))); // rubber band at both ends
  pull=rr>0?rub(rr):-rub(rl);
  vel=dx/Math.max(8,now-drag.t); drag.last=e.clientX; drag.t=now; draw();});
window.addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;
  if(d.lock!=='x') return;
  if(fzOn){fzOn=false;slowMs=0;draw()} // letting go after a close look returns to the chosen scale
  if(pull!==0){release();return}
  if(!matchMedia('(prefers-reduced-motion: reduce)').matches)coast();
});
window.addEventListener('pointercancel',()=>{if(drag){drag=null;if(pull!==0)release()}});
function release(){ // reveal next week if pulled far enough; the pull springs back and the new week slides in
  const W=box.clientWidth, end=D.t[D.t.length-1]+H, reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(pull<0) extendBack();
  if(pull>=W*0.15&&D.fut<end&&!D.partial){const from=D.fut; D.fut=Math.min(end,D.fut+7*DAY); if(!reduce) warp={from,e:0}}
  const p0=pull, t0=performance.now();
  const step=now=>{const ms=now-t0;
    const kp=reduce?1:Math.min(1,ms/240); pull=p0*Math.pow(1-kp,3);
    let done=kp>=1;
    if(warp){const kw=Math.min(1,ms/460), q=kw-1; warp.e=1+2.3*q*q*q+1.3*q*q; if(kw>=1) warp=null; else done=false}
    draw(); if(!done) raf=requestAnimationFrame(step)};
  raf=requestAnimationFrame(step);
}
function coast(){const step=()=>{vel*=.94;if(Math.abs(vel)<.02)return;center-=vel*16/(box.clientWidth/spanV)*H;const c=center;clamp();draw();if(c!==center)return;raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)}
box.addEventListener('wheel',e=>{if(!D)return;e.preventDefault();const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;center+=d/(box.clientWidth/spanV)*H;clamp();draw()},{passive:false});
box.tabIndex=0;
box.addEventListener('keydown',e=>{if(!D)return;
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){center+=(e.key==='ArrowLeft'?-1:1)*(e.shiftKey?DAY:H);clamp();draw();e.preventDefault()}
  if(e.key==='Enter'||e.key===' '){setPin(pin!=null&&idxAt(pin)===idxAt(center)?null:D.t[idxAt(center)]);e.preventDefault()}});
const ovSet=e=>{const r=ovbox.getBoundingClientRect();const f=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));center=D.t[0]+f*(D.fut-D.t[0]);clamp();draw()};
let ovDrag=false;
ovbox.addEventListener('pointerdown',e=>{if(!D)return;ovDrag=true;ovbox.setPointerCapture?.(e.pointerId);ovSet(e)});
ovbox.addEventListener('pointermove',e=>{if(ovDrag)ovSet(e)});
ovbox.addEventListener('pointerup',()=>ovDrag=false);

function setZoom(h){
  fzOn=false;slowMs=0;
  if(vc!=null&&spanH<4000) center=vc; // start the new scale from the point under the cursor (the year view keeps the hour it was opened with)
  spanH=h;vc=null;spd=0;lastC=null;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(+b.dataset.h===h)));store.set('span',String(h));if(D){clamp();draw()}}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setZoom(+b.dataset.h)));
$('today').addEventListener('click',()=>goToday());
// what the chart shows: temperature, feels-like, wind, pressure, humidity, clouds. Kept on this device, shared with three.html
function useMetric(k){
  if(!METRICS[k]||k===metric) return;
  if(D&&chart.width&&!matchMedia('(prefers-reduced-motion: reduce)').matches){ // the old picture fades while the new one is drawn under it
    const img=document.createElement('canvas'); img.width=chart.width; img.height=chart.height; img.getContext('2d').drawImage(chart,0,0);
    const t0=performance.now(); swap={img,e:0};
    const step=now=>{if(!swap||swap.img!==img) return; const q=Math.min(1,(now-t0)/320); swap.e=q*q*(3-2*q); render(); if(q<1) requestAnimationFrame(step); else {swap=null; render()}};
    requestAnimationFrame(step);
  }
  metric=k; store.set('metric',k); showMetric();
  if(D){useCols(D); rebuildDays(); yMin=null; draw()}
}
function showMetric(){const m=M(); $('modeName').textContent=m.name; $('modeBtn').setAttribute('aria-label','Показывать: '+m.name.toLowerCase()+'. Сменить');
  chart.setAttribute('aria-label','График по часам: '+m.name.toLowerCase()+'; тяните влево и вправо');
  [...$('modes').children].forEach(li=>li.setAttribute('aria-checked',String(li.dataset.k===metric)))}
function modesOpen(on){const ul=$('modes'); ul.hidden=!on; $('modeBtn').setAttribute('aria-expanded',String(on)); if(on) ul.querySelector('[aria-checked="true"]')?.focus()}
Object.entries(METRICS).forEach(([k,m])=>{const li=document.createElement('li'); li.setAttribute('role','option'); li.dataset.k=k; li.tabIndex=-1;
  const dot=document.createElement('i'), tx=document.createElement('div'), b=document.createElement('b'), sp=document.createElement('span');
  b.textContent=m.name; sp.textContent=m.hint; tx.append(b,sp); li.append(dot,tx);
  li.addEventListener('click',()=>{modesOpen(false); useMetric(k); $('modeBtn').focus()});
  li.addEventListener('keydown',e=>{const l=[...$('modes').children], i=l.indexOf(li);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length].focus()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault(); li.click()}
    else if(e.key==='Escape'){modesOpen(false); $('modeBtn').focus()}});
  $('modes').append(li)});
$('modeBtn').addEventListener('click',()=>modesOpen($('modes').hidden));
document.addEventListener('pointerdown',e=>{if(!$('modes').hidden&&!e.target.closest('.mode')) modesOpen(false)});
showMetric();
$('pinBtn').addEventListener('click',()=>{if(!D)return;setPin(pin!=null?null:D.t[idxAt(vc??center)])});
// suggestions while typing: up to six places with region and country
let sugg=[], suggSel=-1, suggT=0, suggQ='';
function showSugg(list){const ul=$('sugg'); sugg=list; suggSel=-1; ul.textContent='';
  list.forEach((w,i)=>{const li=document.createElement('li'); li.setAttribute('role','option'); li.id='sg'+i;
    const b=document.createElement('b'); b.textContent=w.name; li.append(b);
    if(w.region){const sp=document.createElement('span'); sp.textContent=w.region; li.append(sp)}
    li.addEventListener('pointerdown',ev=>{ev.preventDefault(); pickSugg(i)}); ul.append(li)});
  ul.hidden=!list.length; $('city').setAttribute('aria-expanded',String(!!list.length));}
function hideSugg(){showSugg([])}
function markSugg(){[...$('sugg').children].forEach((li,i)=>li.setAttribute('aria-selected',String(i===suggSel)));
  $('city').setAttribute('aria-activedescendant',suggSel>=0?'sg'+suggSel:'')}
function pickSugg(i){const w=sugg[i]; if(!w) return; hideSugg(); $('city').value=w.name; $('city').blur();
  setPin(null); load({name:w.name,lat:+w.lat.toFixed(3),lon:+w.lon.toFixed(3)},true)}
$('city').addEventListener('input',()=>{const q=$('city').value.trim(); clearTimeout(suggT);
  if(q.length<2){hideSugg();return}
  suggT=setTimeout(async()=>{suggQ=q; let r=[]; try{r=await geocodeAll(q,6)}catch(e){} if(suggQ===q&&document.activeElement===$('city')) showSugg(r)},250)});
$('city').addEventListener('keydown',e=>{if($('sugg').hidden) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); suggSel=(suggSel+(e.key==='ArrowDown'?1:-1)+sugg.length)%sugg.length; markSugg()}
  else if(e.key==='Enter'&&suggSel>=0){e.preventDefault(); pickSugg(suggSel)}
  else if(e.key==='Escape'){hideSugg()}});
$('city').addEventListener('blur',()=>setTimeout(hideSugg,150));
$('cityForm').addEventListener('submit',async e=>{e.preventDefault();const q=$('city').value.trim();
  if(sugg[0]&&suggQ===q){pickSugg(0);return} // Enter takes the first suggestion
  $('city').blur();hideSugg();if(!q)return;
  $('chartbox').classList.add('loading');
  let w=null; try{w=await geocode(q)}catch(err){}
  if(!w){$('chartbox').classList.remove('loading');toast(D&&D.sample?'Внутри Claude поиск городов не работает. Откройте tastex.github.io/termograf':'Город «'+q+'» не найден. Проверьте название');return}
  setPin(null); load(w,true)});
$('city').addEventListener('blur',()=>{setTimeout(()=>window.scrollTo(0,0),50)});
$('locBtn').addEventListener('click',async()=>{const b=$('locBtn');b.classList.add('busy');
  try{const w=await hereByGps();setPin(null);await load(w,true)}
  catch(err){
    // GPS refused or failed: fall back to the city by network and say why
    const framed=window.top!==window, ios=/iP(hone|ad|od)/.test(navigator.userAgent);
    const why=framed?'Внутри Claude геопозиция не работает. Откройте tastex.github.io/termograf'
      :err&&err.code===1?(ios?'Геопозиция выключена для сайтов: Настройки → Конфиденциальность → Службы геолокации → Сайты Safari':'Браузер не разрешил определить место. Разрешите доступ к геопозиции в настройках сайта')
      :err&&err.code===3?'Место не определилось за 10 секунд':'Точное место определить не удалось';
    let w=null; try{w=await hereByIp()}catch(e){}
    if(w){setPin(null);await load(w,why+'. Пока показываем '+w.name+': город определили по интернет‑подключению')} else toast(why);
  }
  b.classList.remove('busy')});
addEventListener('resize',draw);
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',draw);
new MutationObserver(draw).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});

setZoom(+(store.get('span')||72));
// keep "now" current while the page is open, and refresh the data after a long sleep
setInterval(()=>{if(D){D.now=Date.now()+D.off;draw()}},60000);
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState!=='visible'||!D) return;
  D.now=Date.now()+D.off;
  if(!D.sample&&D.where&&Date.now()-D.at>30*60000) load(D.where,false); else draw();
});

/* ---------- link with the city, home-screen app ---------- */
function setUrl(w){ // keep the place in the address so a bookmark or home-screen icon opens this city
  try{const u=new URL(location.href); u.search=''; u.searchParams.set('city',w.name); u.searchParams.set('lat',w.lat); u.searchParams.set('lon',w.lon);
    history.replaceState(null,'',u); updateManifest(w); $('x3').href='three.html'+u.search; $('yr').href='years.html'+u.search}catch(e){}
}
function updateManifest(w){
  const link=document.querySelector('link[rel="manifest"]'); if(!link) return;
  const base=new URL('./',location.href).href, abs=f=>new URL(f,base).href;
  const m={id:location.href,name:'Термограф — '+w.name,short_name:w.name.length<=12?w.name:'Термограф',lang:'ru',
    start_url:location.href,scope:base,display:'standalone',background_color:'#f3f5f7',theme_color:'#5b3fc4',
    icons:[{src:abs('icon-192.png'),sizes:'192x192',type:'image/png'},{src:abs('icon-512.png'),sizes:'512x512',type:'image/png'},
      {src:abs('icon-maskable-512.png'),sizes:'512x512',type:'image/png',purpose:'maskable'}]};
  link.href='data:application/manifest+json,'+encodeURIComponent(JSON.stringify(m));
  const t=document.querySelector('meta[name="apple-mobile-web-app-title"]'); if(t) t.content=m.short_name;
}
async function placeFromUrl(){
  const q=new URLSearchParams(location.search), lat=parseFloat(q.get('lat')), lon=parseFloat(q.get('lon')), c=q.get('city');
  if(isFinite(lat)&&isFinite(lon)) return {name:c||'Место',lat,lon};
  if(c){try{return await geocode(c)}catch(e){}}
  return null;
}
if('serviceWorker' in navigator&&window.top===window&&location.protocol==='https:') navigator.serviceWorker.register('sw.js').catch(()=>{});

(async()=>{ // start: place in the link → saved place → silent GPS if already allowed → city by network → Moscow
  const MSK={name:'Москва',lat:55.756,lon:37.617};
  let w=await placeFromUrl();
  if(!w){try{w=JSON.parse(store.get('place')||'null')}catch(e){}}
  if(!w){try{const st=await navigator.permissions?.query({name:'geolocation'}); if(st&&st.state==='granted') w=await hereByGps()}catch(e){}}
  if(!w){try{w=await hereByIp()}catch(e){}}
  load(w||MSK,false);
})();
})();
</script>
