<style>
/* Experimental: three stacked charts — mornings, middays, evenings — one point per day, so the day/night swing is gone and the drift from day to day shows */
:root{
  --paper:#f3f5f7; --paper-2:#e6ebef; --grid:#c9d3dc; --grid-strong:#9fb0bf;
  --ink:#5b3fc4; --ink-soft:rgba(91,63,196,.13);
  --fg:#1d2430; --muted:#5f6b7a; --future:rgba(29,36,48,.045); --hot:#c2482a; --cold:#1f74b5; --warn:#8a5a00; --warn-bg:#fff3d6;
  --c-m:#2f86b8; --c-d:#c2482a; --c-e:#5b3fc4;
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif;
  /* type scale: 40 numbers · 16 text · 13 labels · 11 chart */
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554; --ink:#a891ff; --ink-soft:rgba(168,145,255,.16);
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --hot:#ff8a66; --cold:#6cb8ff; --warn:#f2c46b; --warn-bg:#2d2412;
  --c-m:#5bb3e6; --c-d:#ff8a66; --c-e:#a891ff; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#12161d; --paper-2:#1a2029; --grid:#262e3a; --grid-strong:#3a4554; --ink:#a891ff; --ink-soft:rgba(168,145,255,.16);
  --fg:#e7ebf1; --muted:#8e99a8; --future:rgba(255,255,255,.035); --hot:#ff8a66; --cold:#6cb8ff; --warn:#f2c46b; --warn-bg:#2d2412;
  --c-m:#5bb3e6; --c-d:#ff8a66; --c-e:#a891ff; color-scheme:dark}
html,body{height:100%}
html{box-sizing:border-box}
body{background:var(--paper);color:var(--fg);font-family:var(--f-body);overflow:hidden}
.app{box-sizing:border-box;height:100%;display:flex;flex-direction:column;gap:10px;max-width:1100px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px}
header{display:grid;grid-template-rows:22px auto 22px;row-gap:2px}
.rel{text-align:right;font:500 16px/22px var(--f-body);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when{font:500 16px/22px var(--f-body);white-space:nowrap;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis}
.cols{display:contents}
.row{display:grid;grid-template-columns:repeat(3,1fr);column-gap:12px;min-width:0}
.part{all:unset;display:grid;grid-template-rows:18px 44px 18px;min-width:0;cursor:pointer;transition:opacity .18s ease}
.part>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.parts.focus .part:not(.on){opacity:.35}
.part:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:6px}
.row>div{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbl{font:500 13px/18px var(--f-body)}
.lbl.m{color:var(--c-m)}.lbl.d{color:var(--c-d)}.lbl.e{color:var(--c-e)}
.num{font:700 40px/44px var(--f-display);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.dv{font:400 13px/18px var(--f-body);color:var(--muted)}
.dv.warm{color:var(--hot)}.dv.cool{color:var(--cold)}
.chartbox{flex:1;min-height:240px;position:relative;border-top:1px solid var(--grid-strong);border-bottom:1px solid var(--grid-strong);touch-action:pan-y;cursor:grab;user-select:none}
.chartbox:active{cursor:grabbing}
canvas{display:block;width:100%;height:100%}
.ovbox{height:54px;position:relative;touch-action:none;cursor:pointer}
/* how much the strip shows: a year, ten years or everything loaded */
.ovz{position:absolute;top:2px;right:2px;height:22px;display:flex;align-items:center;gap:4px;font:500 11px/1 var(--f-body);color:var(--ink);
  background:var(--paper);border:1px solid var(--ink-soft);border-radius:999px;padding:0 9px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.ovz::before{content:"";position:absolute;inset:-10px -4px -12px -10px} /* a bigger target for the finger */
.ovz[hidden]{display:none}
.bar{display:flex;align-items:center;justify-content:space-between;gap:8px}
.seg{box-sizing:border-box;height:36px;display:inline-flex;align-items:stretch;background:var(--paper-2);border-radius:999px;padding:3px}
.seg button{display:flex;align-items:center;font:500 13px var(--f-body);color:var(--muted);background:transparent;border:0;border-radius:999px;padding:0 9px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--paper);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.ibtn{box-sizing:border-box;flex:none;width:36px;height:36px;display:grid;place-items:center;border-radius:999px;border:1px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;padding:0}
.ibtn:disabled{opacity:.35;cursor:default}
button:focus-visible,a:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
/* the bottom block matches the main page height for height, so it stays put when switching between them */
.foot{height:32px;display:flex;align-items:center;gap:6px;font:400 13px var(--f-body);color:var(--muted)}
.foot b{font:500 16px var(--f-body);color:var(--fg)}
.links{height:18px;display:flex;align-items:center;justify-content:space-between;gap:14px;font:400 13px/18px var(--f-body);color:var(--muted);white-space:nowrap}
.links a{color:inherit}
.links a.back{font-weight:500;color:var(--ink);text-decoration:none}
.links a.back:hover{text-decoration:underline}
.links .go{display:flex;gap:12px}
.mode{position:relative;flex:none;margin-left:auto}
.mbtn{box-sizing:border-box;height:32px;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);color:var(--ink);background:var(--paper-2);border:0;border-radius:999px;padding:0 12px;cursor:pointer;white-space:nowrap}
.mbtn svg{transition:transform .18s ease}.mbtn[aria-expanded="true"] svg{transform:rotate(180deg)}
.modes{position:absolute;right:0;bottom:calc(100% + 6px);z-index:15;width:min(280px,calc(100vw - 32px));margin:0;padding:4px;list-style:none;
  background:var(--paper);border:1px solid var(--grid);border-radius:12px;box-shadow:0 8px 28px rgba(0,0,0,.16);transform-origin:100% 100%;animation:pop .16s ease-out}
.modes li{padding:9px 10px;border-radius:8px;cursor:pointer;display:flex;align-items:center;gap:10px}
.modes li:hover,.modes li:focus{background:var(--paper-2);outline:none}
.modes li>div{display:flex;flex-direction:column;gap:1px;min-width:0}
.modes b{font:500 16px var(--f-body);color:var(--fg)}.modes li[aria-checked="true"] b{color:var(--ink)}
.modes span{font:400 13px var(--f-body);color:var(--muted)}
.modes i{flex:none;width:8px;height:8px;border-radius:50%;border:1.5px solid var(--grid-strong)}
.modes li[aria-checked="true"] i{background:var(--ink);border-color:var(--ink)}
@keyframes pop{from{opacity:0;transform:translateY(6px) scale(.97)}}
@media (prefers-reduced-motion:reduce){.modes{animation:none}.mbtn svg{transition:none}}
.note{font:400 13px/1.4 var(--f-body);color:var(--warn);background:var(--warn-bg);border-radius:8px;padding:7px 10px}
@media (prefers-reduced-motion:reduce){.part{transition:none}}
</style>
<style>body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
/* iPhone home-screen app: never less than the status bar, even if Safari reports no inset */
:root.ios-app{padding-top:max(env(safe-area-inset-top,0px),54px);padding-bottom:max(env(safe-area-inset-bottom,0px),20px)}</style>

<body>

<div class="app">
  <header>
    <div class="rel" id="rel">&nbsp;</div>
    <div class="row parts" id="parts">
      <button class="part" data-j="0" aria-pressed="false"><div class="lbl m">Утро · 6–10</div><div class="num" id="n0">—</div><div class="dv" id="d0">&nbsp;</div></button>
      <button class="part" data-j="1" aria-pressed="false"><div class="lbl d">День · 12–16</div><div class="num" id="n1">—</div><div class="dv" id="d1">&nbsp;</div></button>
      <button class="part" data-j="2" aria-pressed="false"><div class="lbl e">Вечер · 18–22</div><div class="num" id="n2">—</div><div class="dv" id="d2">&nbsp;</div></button>
    </div>
    <div class="when" id="date">Загружаем погоду…</div>
  </header>
  <div class="note" id="note" hidden>Это пример, а не настоящая погода: внутри Claude страница не может её загрузить. Настоящая — на tastex.github.io/termograf/three.html</div>
  <div class="chartbox" id="box"><canvas id="cv" aria-label="Три графика: утро, день и вечер, по точке на день. Тяните влево и вправо, нажмите на график, чтобы раскрыть его"></canvas></div>
  <div class="ovbox" id="ovbox"><canvas id="ov" aria-label="Обзор загруженного периода"></canvas><button class="ovz" id="ovz" type="button" hidden><span></span></button></div>
  <div class="bar">
    <div class="seg" role="group" aria-label="Масштаб">
      <button data-d="14">2 недели</button><button data-d="31">Месяц</button><button data-d="92">3 месяца</button><button data-d="365">Год</button>
    </div>
    <button class="ibtn" id="today" type="button" aria-label="Перейти к сегодня" title="Перейти к сегодня"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/><circle cx="12" cy="15" r="1.6" fill="currentColor" stroke="none"/></svg></button>
  </div>
  <div class="foot"><span>Город</span><b id="city">—</b>
    <div class="mode">
      <button class="mbtn" id="modeBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="modes"><span id="modeName">Температура</span><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button>
      <ul class="modes" id="modes" role="listbox" aria-label="Что показывать" hidden></ul>
    </div>
  </div>
  <div class="links"><div>Данные <a href="https://open-meteo.com" target="_blank" rel="noopener">Open‑Meteo</a></div><div class="go"><a class="back" id="back" href="./">Обычный график</a><a class="back" id="yr" href="years.html">По годам</a></div></div>
</div>

<script>
(()=>{
const H=3600e3, DAY=24*H, $=id=>document.getElementById(id);
const WD=['вс','пн','вт','ср','чт','пт','сб'], MON=['янв','фев','мар','апр','мая','июн','июл','авг','сен','окт','ноя','дек'];
const FONT='"Golos Text",system-ui,sans-serif';
const PARTS=[{k:'m',a:6,b:10},{k:'d',a:12,b:16},{k:'e',a:18,b:22}];
const ARCHIVE_START=Date.UTC(1940,0,1); // the whole Open-Meteo archive, loaded a year at a time as the view gets there
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
// the moment and the scale on screen, shared by the three pages, so switching between them keeps both:
// t — the moment in view, the city's local time as UTC ms; d — the span in days; now — the view stood on today.
// Kept for seven minutes: the app closed and opened again within them shows what it showed, later it opens on today
const IDLE=7*60e3; // seven minutes away: enough to forget what was on screen, so today and fresh data
const VIEW_IN=(()=>{try{const v=JSON.parse(store.get('view')||'null'); return v&&Date.now()-v.at<IDLE&&isFinite(v.t)&&v.d>0?v:null}catch(e){return null}})();
const nearest=(d,opts)=>opts.reduce((a,b)=>Math.abs(Math.log(b/d))<Math.abs(Math.log(a/d))?b:a);
function keepView(f){const save=()=>{const v=f(); if(v) store.set('view',JSON.stringify({...v,at:Date.now()}))};
  addEventListener('pagehide',save); document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') save()});
  document.querySelectorAll('.go a').forEach(a=>a.addEventListener('click',save))}
// back after seven minutes away (screen off, another app): back(), as if the app were opened anew;
// left on screen untouched: idle() every seven minutes, for an hour
function onWake(back,idle){ let away=0, touched=Date.now(), last=Date.now();
  const ret=()=>{if(away&&Date.now()-away>=IDLE){touched=last=Date.now(); back()} away=0};
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden') away=away||Date.now(); else ret()});
  addEventListener('pageshow',e=>{if(e.persisted) ret()});
  ['pointerdown','keydown','wheel'].forEach(k=>addEventListener(k,()=>touched=Date.now(),{capture:true,passive:true}));
  if(idle) setInterval(()=>{const t=Date.now(); if(document.visibilityState==='visible'&&t-touched>=IDLE&&t-touched<3600e3&&t-last>=IDLE){last=t; idle()}},60000)}
const css=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const fmtT=v=>{if(v==null||isNaN(v))return '—';const r=Math.round(v);return (r>0?'+':r<0?'−':'')+Math.abs(r)+'°'};
const dayOf=ms=>Math.floor(ms/DAY)*DAY;
// what the charts show, the same choice as on the main page: an Open-Meteo variable each, with its units and scale.
// g: the scale rounds to it, min: the narrowest scale, lim: values that cannot be passed, step: grid lines [fine, coarse, coarse from this range]
const METRICS={
  temp:{v:'temperature_2m',name:'Температура',hint:'°C',num:fmtT,unit:'°',g:2,min:6,step:[2,5,16]},
  feel:{v:'apparent_temperature',name:'Ощущается',hint:'с учётом ветра и влажности',num:fmtT,unit:'°',g:2,min:6,step:[2,5,16]},
  wind:{v:'wind_speed_10m',name:'Ветер',hint:'м/с',num:v=>v<9.95?v.toFixed(1).replace('.',','):String(Math.round(v)),same:.5,unit:'\u202fм/с',g:1,min:4,lim:[0,1e9],step:[1,2,8]},
  pres:{v:'pressure_msl',name:'Давление',hint:'мм рт. ст.',unit:'\u202fмм',k:0.750062,g:2,min:6,step:[2,5,16]},
  hum:{v:'relative_humidity_2m',name:'Влажность',hint:'относительная, %',unit:'%',g:5,min:20,lim:[0,100],step:[10,25,50]},
  cloud:{v:'cloud_cover',name:'Облачность',hint:'доля неба в облаках, %',unit:'%',g:10,min:30,lim:[0,100],step:[10,25,50]},
};
const MK=Object.keys(METRICS);
// exactly what the main page asks for (more than this page needs), so the two share the answers kept in the phone's memory
const VARS='temperature_2m,apparent_temperature,wind_speed_10m,wind_gusts_10m,wind_direction_10m,pressure_msl,relative_humidity_2m,cloud_cover,precipitation,weather_code';
let metric='temp'; try{const m=localStorage.getItem('metric'); if(METRICS[m]) metric=m}catch(e){}
const M=()=>METRICS[metric], fmtV=v=>v==null||isNaN(v)?'—':M().num?M().num(v):String(Math.round(v))+(M().unit==='%'?'%':'');
const plur=(n,f)=>{const a=Math.abs(n)%100,b=a%10;return n+' '+(a>10&&a<20?f[2]:b===1?f[0]:b>=2&&b<=4?f[1]:f[2])};
const DN=['день','дня','дней'], NED=['неделю','недели','недель'], MES=['месяц','месяца','месяцев'];
const reduce=()=>matchMedia('(prefers-reduced-motion: reduce)').matches;

let days=[], todayI=0, nowMs=0, W0=null, sample=false, loading=false, limit=0, holes=[], err=null, wait=0; // holes: [from,to) ms of days not loaded yet; err, wait: why the archive pauses and until when
let center=0, vc=0, wheelT=0, ovDrag=false, glide=false, span=14, ys=null, drag=null, vel=0, raf=0, drawQ=0, spd=0, lastC=null, pull=0, fade=null;
let focus=null, wNow=[1,1,1], wFrom=[1,1,1], wTo=[1,1,1], wT0=0;   // band weights; a tapped chart takes the whole height
try{span=+store.get('x3span')||14}catch(e){}

// Open-Meteo directly, or through your own mirror (a Cloudflare Worker) when the direct address does not answer.
// The mirror address goes into MIRROR below, or once through the link: ?mirror=https://name.account.workers.dev
const MIRROR='https://termograf.tasteofthefloor.workers.dev';
const OM_HOSTS={'api.open-meteo.com':'api','archive-api.open-meteo.com':'archive','geocoding-api.open-meteo.com':'geo'};
(()=>{try{const m=new URLSearchParams(location.search).get('mirror'); if(m!=null){m?localStorage.setItem('mirror',m):localStorage.removeItem('mirror')}}catch(e){}})();
const mirrorBase=()=>{let m=MIRROR; try{m=localStorage.getItem('mirror')||m}catch(e){} return (m||'').replace(/\/+$/,'')};
function fetchT(u,ms){const c=new AbortController(), t=setTimeout(()=>c.abort(),ms); return fetch(u,{signal:c.signal}).finally(()=>clearTimeout(t))}
async function omTry(u){
  const m=mirrorBase(), x=new URL(u), via=m?m+'/'+OM_HOSTS[x.host]+x.pathname+x.search:null;
  let skip=false; try{skip=sessionStorage.getItem('omDirect')==='no'}catch(e){}
  if(via&&skip) return fetch(via);
  try{const r=await fetchT(u,via?5000:30000); if(!r.ok&&via) throw 0; return r}
  catch(e){ if(!via) throw e; try{sessionStorage.setItem('omDirect','no')}catch(_){} return fetch(via) }
}
// Open-Meteo lets each address make so many requests a minute, an hour and a day. When neither way gets through,
// all three pages stop asking for a while and say why, instead of passing the empty archive off as its start.
// The error's kind: minute, hour, day — which limit is used up; net — no answer at all
const LIMIT_WAIT={minute:60e3,hour:10*60e3,day:60*60e3};
const omErr=kind=>Object.assign(new Error(kind),{kind});
async function om(u){
  let lim=null; try{lim=JSON.parse(localStorage.getItem('omLimit')||'null')}catch(e){}
  if(lim&&Date.now()<lim.until) throw omErr(lim.kind);
  let r; try{r=await omTry(u)}catch(e){throw omErr('net')}
  if(r.status===429){let why=''; try{why=(await r.clone().json()).reason||''}catch(e){}
    const kind=/minut/i.test(why)?'minute':/hour/i.test(why)?'hour':'day';
    try{localStorage.setItem('omLimit',JSON.stringify({kind,until:Date.now()+LIMIT_WAIT[kind]}))}catch(e){}
    throw omErr(kind)}
  if(r.status>=500) throw omErr('net');
  return r;
}
// what the person reads when the archive stops: a sentence for the toast, two short lines for the chart's edge
const LIMIT_SAY={
  minute:['Архив на паузе: сервис погоды ограничил число запросов. Догрузим через минуту','Архив на паузе','догрузим через минуту'],
  hour:['Архив на паузе: сервис погоды ограничил число запросов. Догрузим в течение часа','Архив на паузе','догрузим в течение часа'],
  day:['Архив на паузе до завтра: сервис погоды ограничил число запросов на сегодня. Загруженное остаётся на графике','Архив на паузе','догрузим завтра'],
  net:['Архив не загрузился. Проверьте интернет, и мы попробуем ещё раз','Архив не загрузился','проверьте интернет'],
};
// the request is still worth making later: a limit or no connection, not an archive that has nothing there
const later=e=>!!(e&&LIMIT_SAY[e.kind]);
// Ask the browser to keep the stored years even when the device runs short of space (a no on older browsers changes nothing)
try{navigator.storage?.persist?.().catch(()=>{})}catch(e){}
// Responses kept in the phone's memory (IndexedDB) and shared by the main page and «утро, день, вечер»: both ask for
// exactly the same addresses, so switching pages or coming back takes the forecast and the archive from here.
// Each entry keeps for `keep` ms: the forecast for minutes, past years of archive for months (see archKeep)
const idb=(()=>{let p=null;
  const open=()=>p??=new Promise((res,rej)=>{const r=indexedDB.open('termograf',1); r.onupgradeneeded=()=>r.result.createObjectStore('r'); r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error)});

  if(xs>0) paused?hint(0,xs,...LIMIT_SAY[err].slice(1),C.muted):hint(0,xs,loading?'Загружаем':'Начало архива',loading?'ещё год архива':'раньше данных нет',loading?C.ink:C.muted);
  for(const [ha,hb] of holes){const a=Math.max(0,X((ha-days[0].k)/DAY)-ppd/2), b=Math.min(W,X((hb-days[0].k)/DAY)-ppd/2);
    if(b-a>=90) paused?hint(a,b,...LIMIT_SAY[err].slice(1),C.muted):hint(a,b,'Загружаем',`архив за ${new Date(Math.max(ha,Math.min(hb-DAY,days[Math.round(vc)]?.k??ha))).getUTCFullYear()} год`,C.ink)}
  if(xe<W) hint(xe,W,'Конец прогноза','дальше данных нет',C.muted);
  readout(Math.round(vc));
  $('today').disabled=Math.round(vc)===todayI&&!drag;
  drawOv(C);
}
function readout(i){
  const d=days[i]; if(!d) return; const dt=new Date(d.k), dd=Math.round((d.k-dayOf(nowMs))/DAY), ad=-dd;
  const yrs=n=>{const m10=n%10,m100=n%100;return n===1?'год назад':n+(m10===1&&m100!==11?' год назад':m10>=2&&m10<=4&&(m100<12||m100>14)?' года назад':' лет назад')};
  const rel={'-2':'позавчера','-1':'вчера','0':'сегодня','1':'завтра','2':'послезавтра'}[dd]||(dd>0?`через ${plur(dd,DN)}`:ad<14?`${plur(ad,DN)} назад`:ad<60?`${plur(Math.round(ad/7),NED)} назад`:ad<351?`${plur(Math.round(ad/30.4),MES)} назад`:yrs(Math.max(1,Math.round(ad/365.25))));
  $('date').textContent=WD[dt.getUTCDay()]+', '+dt.getUTCDate()+' '+MON[dt.getUTCMonth()]+(dt.getUTCFullYear()!==new Date(nowMs).getUTCFullYear()?' '+dt.getUTCFullYear():'');
  const mt=M(); $('rel').textContent=rel[0].toUpperCase()+rel.slice(1)+(d.hole?' · загружаем архив':dd>0?' · прогноз':'')+(metric!=='temp'?' · '+mt.name.toLowerCase()+', '+mt.unit.trim():'');
  PARTS.forEach((p,j)=>{const v=d.v[j], pv=days[i-1]?.v[j]; $('n'+j).textContent=fmtV(v);
    const el=$('d'+j); if(v==null||pv==null){el.textContent='\u00a0';el.className='dv';return}
    const dv=v-pv, a=Math.abs(dv), same=a<(mt.same||1); // wind is shown to a tenth, so its changes are too
    el.textContent=same?'так же':(dv>0?'+':'−')+(metric==='wind'?mt.num(a):Math.round(a))+mt.unit+' за сутки'; el.className='dv'+(same?'':dv>0?' warm':' cool')});
}

/* ---------- overview strip ---------- */
let ovKey='', ovBg=null;
// The strip shows everything loaded while that is short. Once years of archive are in, it shows a part of them
// (a year, ten years in the year scale) that follows the charts and scrolls while the finger holds at its edge;
// the button in its corner switches between a year, ten years and everything. ovA: the strip's first day, in ms
const OVL=[{s:365,l:'год'},{s:3652,l:'10 лет'},{s:Infinity,l:'всё'}];
let ovPick=null, ovA=null, ovPt=null, ovRaf=0, ovT=0;
const ovLevel=()=>ovPick??(span>=180?1:0);
function ovWin(){ // the part of the days the strip shows, as [first, last+1) in day indices (fractional)
  const n=days.length, S=Math.min(n,OVL[ovLevel()].s);
  if(S>=n){ovA=days[0].k;return [0,n]}
  let a=ovA==null?vc+.5-S/2:(ovA-days[0].k)/DAY;
  if(!ovDrag){ // keep the charts' frame inside, with a little room on its sides; small moves glide, big jumps don't
    const v0=vc+.5-span/2, v1=vc+.5+span/2, m=Math.min(S*.06,(S-span)/2); let t=a;
    if(span>=S) t=vc+.5-S/2; else {if(v0<t+m) t=v0-m; if(v1>t+S-m) t=v1+m-S}
    t=Math.max(0,Math.min(n-S,t));
    if(ovA==null||Math.abs(t-a)>S*.3||Math.abs(t-a)<S*1e-4||reduce()) a=t; else {a+=(t-a)*.35; draw()}
  }
  a=Math.max(0,Math.min(n-S,a)); ovA=days[0].k+a*DAY; return [a,a+S];
}
function drawOv(C){
  const [g,W,Ht]=fit($('ov')), [ia,ib]=ovWin(), S=ib-ia, X=i=>(i+.5-ia)/S*W, dpr=devicePixelRatio||1;
  const key=[ia,days.length,days[0].k,W,Ht,dpr,C.ink,loading].join('|');
  if(key!==ovKey){ovKey=key; ovBg=ovBg||document.createElement('canvas'); ovBg.width=Math.round(W*dpr); ovBg.height=Math.round(Ht*dpr);
    const o=ovBg.getContext('2d'); o.setTransform(dpr,0,0,dpr,0,0); o.clearRect(0,0,W,Ht);
    const n=days.length, i0=Math.max(0,Math.floor(ia)-1), i1=Math.min(n-1,Math.ceil(ib)), vis=days.slice(i0,i1+1);
    let lo=1e9,hi=-1e9; days.forEach(d=>d.v.forEach(v=>{if(v!=null){if(v<lo)lo=v;if(v>hi)hi=v}})); const Y=v=>3+(hi-v)/(hi-lo||1)*(Ht-16);
    const yr0=new Date(days[i0].k).getUTCFullYear()-1, yr1=new Date(days[i1].k).getUTCFullYear(), Xt=ms=>X((ms-days[0].k)/DAY);
    for(let y=yr0;y<=yr1;y++){o.globalAlpha=.10;o.fillStyle=css('--cold');o.fillRect(Xt(Date.UTC(y,11,1)),0,Xt(Date.UTC(y+1,2,1))-Xt(Date.UTC(y,11,1)),Ht-12);o.fillStyle=css('--hot');o.fillRect(Xt(Date.UTC(y,5,1)),0,Xt(Date.UTC(y,8,1))-Xt(Date.UTC(y,5,1)),Ht-12)}
    o.globalAlpha=.6;o.fillStyle=C.ink;
    vis.forEach((d,j)=>{const i=i0+j, vs=d.v.filter(v=>v!=null); if(!vs.length) return; const a=Math.max(...vs), b=Math.min(...vs); o.fillRect(X(i)-W/S/2,Y(a),Math.max(.6,W/S),Math.max(1,Y(b)-Y(a)))});
    o.globalAlpha=1;o.font='500 11px '+FONT;o.textBaseline='alphabetic';o.fillStyle=C.muted; const long=S>700, py=W*365.25/S, yStep=py>=36?1:py>=18?2:py>=7?5:10; let last=-1; // labelled years: every one, or every 2nd, 5th, 10th
    vis.forEach((d,j)=>{const i=i0+j, dt=new Date(d.k); if(dt.getUTCDate()!==1) return; const jan=dt.getUTCMonth()===0, x=X(i);
      if(jan&&dt.getUTCFullYear()%yStep||(!jan&&long)){if(jan||py>=60) o.fillRect(x,Ht-12,1,3)} // small ticks for months, or for the years between the labelled ones
      else{o.fillRect(x,0,1,Ht); const t=jan?String(dt.getUTCFullYear()):MON[dt.getUTCMonth()]; if(x+3>=last){o.fillText(t,x+3,Ht-1);last=x+3+o.measureText(t).width+3}}});
    if(loading){o.fillStyle=C.ink;o.fillText('загрузка…',3,10)}}
  g.clearRect(0,0,W,Ht); g.drawImage(ovBg,0,0,W,Ht);
  // the edges fade where the strip goes on beyond them
  const fadeE=(x,dir)=>{const gr=g.createLinearGradient(x,0,x+dir*18,0); gr.addColorStop(0,C.paper); gr.addColorStop(1,C.paper+'00'); g.fillStyle=gr; g.fillRect(Math.min(x,x+dir*18),0,18,Ht)};
  if(ia>.01) fadeE(0,1); if(ib<days.length-.01) fadeE(W,-1);
  const z=$('ovz'), lab=days.length>OVL[0].s?(S>=days.length?'всё':OVL[ovLevel()].l):'';
  if(z.dataset.l!==lab){z.dataset.l=lab; z.hidden=!lab; z.lastChild.textContent=lab; z.setAttribute('aria-label','Полоса внизу: '+(lab==='всё'?'показано всё загруженное':lab==='год'?'показан год':'показаны '+lab)+'. Сменить')}
  const x0=Math.max(0,X(vc-span/2)), x1=Math.min(W,X(vc+span/2));
  g.fillStyle=C.fg;g.globalAlpha=.08;g.fillRect(x0,0,x1-x0,Ht);g.globalAlpha=1;g.strokeStyle=C.fg;g.lineWidth=1.5;g.strokeRect(x0+.75,.75,Math.max(2,x1-x0-1.5),Ht-1.5);
  g.fillStyle=C.fg;g.fillRect(X(todayI)-.5,0,1,Ht);
}

/* ---------- interaction ---------- */
const box=$('box'), rub=r=>{const W=box.clientWidth;return W*.3*(1-Math.exp(-r/(W*.6)))};
// two fingers (or a trackpad pinch, which comes as the wheel with ctrl) zoom between a week and a year;
// the day between the fingers stays under them
const ptrs=new Map(); let pinch=null;
const SPAN_MIN=7, SPAN_MAX=365;
function zoomAt(d,x,i){ // d: days on screen; x: px from the chart's left edge that shows day i (fractional)
  const W=box.clientWidth; span=Math.min(SPAN_MAX,Math.max(SPAN_MIN,d)); center=clampC(i-(x-W/2)/(W/span)); vc=center; lastC=null; spd=0;
  document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(Math.log(+b.dataset.d/span))<.03)));
  store.set('x3span',String(Math.round(span*10)/10)); draw()}
const dayAt=x=>vc+(x-box.clientWidth/2)/(box.clientWidth/span);
box.addEventListener('pointerdown',e=>{if(!days.length)return; ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){const [a,b]=[...ptrs.values()], r=box.getBoundingClientRect(), mx=(a.x+b.x)/2-r.left;
    cancelAnimationFrame(raf); glide=false; drag=null; pull=0; pinch={d:Math.hypot(a.x-b.x,a.y-b.y)||1,s:span,i:dayAt(mx)}; box.setPointerCapture?.(e.pointerId); return}
  if(ptrs.size>2) return;
  cancelAnimationFrame(raf);viewWant=null;glide=false;drag={x:e.clientX,y:e.clientY,last:e.clientX,t:performance.now(),lock:null,v:center};vel=0});
window.addEventListener('pointermove',e=>{if(ptrs.has(e.pointerId)) ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()], r=box.getBoundingClientRect(); zoomAt(pinch.s*pinch.d/(Math.hypot(a.x-b.x,a.y-b.y)||1),(a.x+b.x)/2-r.left,pinch.i); return}
  if(!drag)return;
  if(drag.lock===null){const dx=Math.abs(e.clientX-drag.x),dy=Math.abs(e.clientY-drag.y);if(dx<6&&dy<6)return;drag.lock=dx>dy?'x':'y';if(drag.lock==='x')box.setPointerCapture?.(e.pointerId)}
  if(drag.lock!=='x')return;
  const dx=e.clientX-drag.last, now=performance.now(), ppd=box.clientWidth/span;
  drag.v-=dx/ppd; center=clampC(drag.v);
  const over=drag.v-(days.length-1), under=-drag.v; pull=over>0?rub(over*ppd):under>0?-rub(under*ppd):0; // rubber band at both ends
  vel=dx/Math.max(8,now-drag.t)/ppd; drag.last=e.clientX; drag.t=now; draw()});
function springBack(){const p0=pull,t0=performance.now();const st=now=>{const k=reduce()?1:Math.min(1,(now-t0)/260);pull=p0*Math.pow(1-k,3);draw();if(k<1)raf=requestAnimationFrame(st)};raf=requestAnimationFrame(st)}
const unptr=e=>{ptrs.delete(e.pointerId); if(pinch&&ptrs.size<2){pinch=null; ys=null; draw()}};
window.addEventListener('pointerup',e=>{unptr(e);if(!drag)return;const d=drag;drag=null;
  if(d.lock===null){ // a tap on a chart opens it to the full height; another tap brings the three back
    const r=box.getBoundingClientRect(), y=d.y-r.top, gm=geom; if(!gm||y<gm.top) return;
    const sumW=wNow.reduce((a,b)=>a+Math.max(0,b),0)||1; let acc=gm.top;
    for(let j=0;j<3;j++){acc+=Math.max(0,wNow[j])/sumW*(gm.Ht-gm.top-2); if(y<acc){setFocus(focus==null?j:null);return}} return}
  if(d.lock!=='x') return;
  if(pull!==0){if(pull<0) extendBack(); springBack(); return}
  if(!reduce()){glide=true;const step=()=>{vel*=.93;if(Math.abs(vel)<.0004){glide=false;draw();return}const c=clampC(center-vel*16);if(c===center){glide=false;draw();return}center=c;draw();raf=requestAnimationFrame(step)};raf=requestAnimationFrame(step)} else draw()});
window.addEventListener('pointercancel',e=>{unptr(e);if(drag){drag=null;if(pull) springBack();draw()}});
box.addEventListener('wheel',e=>{if(!days.length)return;e.preventDefault();
  if(e.ctrlKey){const x=e.clientX-box.getBoundingClientRect().left; zoomAt(span*Math.exp(e.deltaY*.01),x,dayAt(x)); wheelT=performance.now(); return}
  const d=Math.abs(e.deltaX)>Math.abs(e.deltaY)?e.deltaX:e.deltaY;center=clampC(center+d/(box.clientWidth/span));wheelT=performance.now();draw()},{passive:false});
box.tabIndex=0;
box.addEventListener('keydown',e=>{if(e.key==='ArrowLeft'||e.key==='ArrowRight'){center=clampC(Math.round(center)+(e.key==='ArrowLeft'?-1:1));draw();e.preventDefault()}});
document.querySelectorAll('.part').forEach(b=>b.addEventListener('click',()=>setFocus(+b.dataset.j)));
const ov=$('ovbox');
// the finger on the strip moves the cursor to that day; held at an edge, the strip scrolls on (faster nearer the edge)
function ovStep(now){ovRaf=0; if(!ovDrag||!days.length) return;
  const r=ov.getBoundingClientRect(), x=ovPt-r.left, e=Math.min(40,r.width*.12), dt=ovT?Math.min(50,now-ovT):16; ovT=now;
  const push=x<e?-Math.min(1,1-x/e):x>r.width-e?Math.min(1,(x-r.width+e)/e):0;
  let [a,b]=ovWin(); if(push&&b-a<days.length){ovA+=push*(b-a)*DAY*.6*dt/1000; [a,b]=ovWin()}
  center=clampC(a+Math.min(1,Math.max(0,x/r.width))*(b-a)-.5); draw();
  if(push) ovRaf=requestAnimationFrame(ovStep)}
ov.addEventListener('pointerdown',e=>{if(!days.length||e.target.closest('.ovz'))return;cancelAnimationFrame(raf);glide=false;viewWant=null;ovDrag=true;ov.setPointerCapture?.(e.pointerId);ovPt=e.clientX;ovT=0;ovStep(performance.now())});
ov.addEventListener('pointermove',e=>{if(!ovDrag)return;ovPt=e.clientX;if(!ovRaf)ovStep(performance.now())});
const ovEnd=()=>{ovDrag=false;cancelAnimationFrame(ovRaf);ovRaf=0;draw()};
ov.addEventListener('pointerup',ovEnd); ov.addEventListener('pointercancel',ovEnd);
$('ovz').addEventListener('click',()=>{if(!days.length)return; const cur=ovLevel(); // a year → ten years → everything → a year
  ovPick=Math.min(OVL[cur].s,days.length)>=days.length?0:cur+1; ovA=null; ovKey=''; draw()});
function setSpan(d){span=d;ovPick=null;ovA=null;store.set('x3span',String(d));document.querySelectorAll('.seg button').forEach(b=>b.setAttribute('aria-pressed',String(Math.abs(Math.log(+b.dataset.d/d))<.03)));ys=null;spd=0;lastC=null;draw()}
document.querySelectorAll('.seg button').forEach(b=>b.addEventListener('click',()=>setSpan(+b.dataset.d)));
$('today').addEventListener('click',()=>{viewWant=null;goToday()});
function useMetric(k){if(!METRICS[k]||k===metric) return; metric=k; store.set('metric',k); days.forEach(d=>d.v=d.m[k]); ys=null; ovKey=''; showMetric(); draw()}
function showMetric(){const m=M(); $('modeName').textContent=m.name; $('modeBtn').setAttribute('aria-label','Показывать: '+m.name.toLowerCase()+'. Сменить');
  [...$('modes').children].forEach(li=>li.setAttribute('aria-checked',String(li.dataset.k===metric)))}
function modesOpen(on){const ul=$('modes'); ul.hidden=!on; $('modeBtn').setAttribute('aria-expanded',String(on)); if(on) ul.querySelector('[aria-checked="true"]')?.focus()}
MK.forEach(k=>{const m=METRICS[k], li=document.createElement('li'); li.setAttribute('role','option'); li.dataset.k=k; li.tabIndex=-1;
  const dot=document.createElement('i'), tx=document.createElement('div'), b=document.createElement('b'), sp=document.createElement('span');
  b.textContent=m.name; sp.textContent=m.hint; tx.append(b,sp); li.append(dot,tx);
  li.addEventListener('click',()=>{modesOpen(false); useMetric(k); $('modeBtn').focus()});
  li.addEventListener('keydown',e=>{const l=[...$('modes').children], i=l.indexOf(li);
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault(); l[(i+(e.key==='ArrowDown'?1:-1)+l.length)%l.length].focus()}
    else if(e.key==='Enter'||e.key===' '){e.preventDefault(); li.click()}
    else if(e.key==='Escape'){modesOpen(false); $('modeBtn').focus()}});
  $('modes').append(li)});
$('modeBtn').addEventListener('click',()=>modesOpen($('modes').hidden));
document.addEventListener('pointerdown',e=>{if(!$('modes').hidden&&!e.target.closest('.mode')) modesOpen(false)});
showMetric();
addEventListener('resize',()=>{ovKey='';draw()});
matchMedia('(prefers-color-scheme: dark)').addEventListener?.('change',()=>{ovKey='';draw()});
const zIn=VIEW_IN?nearest(VIEW_IN.d,[14,31,92,365]):0;
setSpan(zIn||(span>=SPAN_MIN&&span<=SPAN_MAX?span:14));
keepView(()=>{ const i=Math.round(vc), k=days[i]?.k; if(k==null) return null; // what came from another page stays as it came while untouched here
  const now=viewWant==null&&i===todayI, same=VIEW_IN&&!now&&dayOf(VIEW_IN.t)===k;
  return {t:viewWant!=null||same?VIEW_IN.t:k+12*3600e3, d:span===zIn?VIEW_IN.d:span, now};
});
load();
let loadedAt=Date.now();
const refresh=()=>{if(!sample&&Date.now()-loadedAt>=IDLE){loadedAt=Date.now(); return load()}};
onWake(()=>{ viewWant=null; if(days.length){center=vc=todayI; lastC=null; ys=null; draw()} refresh()?.then(goToday) }, // back after seven minutes: today and fresh data
  ()=>{ const k=days[Math.round(vc)]?.k; if(k!=null&&k>=nowMs-80*DAY) refresh() }); // untouched on screen: fresh data, unless deep in the archive
})();
</script>
</body>
